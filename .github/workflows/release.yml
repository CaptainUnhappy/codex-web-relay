name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag must match package.json version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  verify:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ZIP assets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zips
          path: dist
      - run: sha256sum -c SHA256SUMS
        working-directory: dist
      - name: Create or finish the release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'Published releases are immutable; use a new version tag.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Codex Relay $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/codex-relay-desktop-universal.zip dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
