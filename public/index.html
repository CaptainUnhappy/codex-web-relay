    function persistOpenProjectKeys() {
      localStorage.setItem(GROUPS_STORAGE_KEY, JSON.stringify([...openProjectKeys]));
    }

    function readExpandedProjectThreadKeys() {
      try {
        const keys = JSON.parse(localStorage.getItem(PROJECT_THREAD_EXPANDED_STORAGE_KEY) || '[]');
        return new Set(Array.isArray(keys) ? keys.filter(Boolean) : []);
      } catch {
        return new Set();
      }
    }

    function persistExpandedProjectThreadKeys() {
      localStorage.setItem(PROJECT_THREAD_EXPANDED_STORAGE_KEY, JSON.stringify([...expandedProjectThreadKeys]));
    }

    function readCompletedThreadIds() {
      try {
        const raw = JSON.parse(localStorage.getItem(THREAD_NOTICE_STORAGE_KEY) || '[]');
        const rows = Array.isArray(raw)
          ? raw.map(id => ({ id, at: 0 }))
          : Array.isArray(raw?.rows)
            ? raw.rows
            : Array.isArray(raw?.ids)
              ? raw.ids.map(id => ({ id, at: raw.at || 0 }))
              : [];
        const ids = new Set();
        completedThreadNoticeTimes = new Map();
        for (const row of rows) {
          const id = typeof row === 'string' ? row : row?.id;
          if (!id) continue;
          const rawAt = typeof row === 'string' ? 0 : row.at;
          const at = typeof rawAt === 'number' ? rawAt : Date.parse(rawAt || '') || 0;
          ids.add(id);
          completedThreadNoticeTimes.set(id, at);
        }
        return ids;
      } catch {
        completedThreadNoticeTimes = new Map();
        return new Set();
      }
    }

    function persistCompletedThreadIds() {
      const rows = [...completedThreadIds].map(id => ({
        id,
        at: completedThreadNoticeTimes.get(id) || Date.now(),
      }));
      localStorage.setItem(THREAD_NOTICE_STORAGE_KEY, JSON.stringify({ version: 2, rows }));
    }

    function isCompletedThreadNoticeExpired(id, now = Date.now()) {
      const at = Number(completedThreadNoticeTimes.get(id)) || 0;
      return !at || now - at > THREAD_NOTICE_MAX_AGE_MS;
    }

    function hasUnreadCompletedThread() {
      const knownThreadIds = new Set(knownThreads.map(item => item.id).filter(Boolean));
      const now = Date.now();
      for (const id of completedThreadIds) {
        if (!id || id === selectedThreadId) continue;
        if (isCompletedThreadNoticeExpired(id, now)) continue;
        if (knownThreadIds.size && !knownThreadIds.has(id)) continue;
        return true;
      }
      return false;
    }

    function pruneCompletedThreadNotices() {
      const knownThreadIds = new Set(knownThreads.map(item => item.id).filter(Boolean));
      const now = Date.now();
      let changed = false;
      for (const id of [...completedThreadIds]) {
        const runtime = threadRuntimeStates.get(id);
        if (id === selectedThreadId || isCompletedThreadNoticeExpired(id, now) || (knownThreadIds.size && !knownThreadIds.has(id)) || isThreadRunningStatus(runtime?.status)) {
          completedThreadIds.delete(id);
          completedThreadNoticeTimes.delete(id);
          changed = true;
        }
      }
      if (changed) persistCompletedThreadIds();
      updateTitleDotState();
    }

    function hasOtherRunningThread() {
      for (const [id, runtime] of threadRuntimeStates) {
        if (id && id !== selectedThreadId && isThreadRunningStatus(runtime?.status)) return true;
      }
      for (const item of flattenKnownThreads()) {
        if (!item?.id || item.id === selectedThreadId) continue;
        const runtime = threadRuntimeStates.get(item.id) || runtimeSnapshotFromThread(item) || {};
        if (isThreadRunningStatus(runtime.status)) return true;
      }
      return false;
    }

    function isSelectedThreadRunning() {
      const runtime = selectedThreadId ? threadRuntimeStates.get(selectedThreadId) : null;
      return Boolean(activeAssistant || pollTimer || isThreadRunningStatus(runtime?.status));
    }

    function updateTitleDotState() {
      const currentWorking = Boolean(foregroundDotBusy || isSelectedThreadRunning());
      const otherRunning = hasOtherRunningThread();
      const anyWorking = currentWorking || otherRunning;
      const unreadComplete = hasUnreadCompletedThread();
      document.body.classList.remove('dot-working', 'dot-background-working', 'dot-attention');
      document.body.classList.toggle('dot-flashing', anyWorking);
      document.body.classList.toggle('dot-blue', unreadComplete);
      document.body.classList.toggle('dot-orange', !unreadComplete && otherRunning);
    }

    function isThreadRunningStatus(status) {
      return status === 'running' || status === 'waiting';
    }

    function isThreadCompleteStatus(status) {
      return status === 'complete' || status === 'error';
    }

    function clearLocalStopSuppression(threadId) {
      if (!threadId) return;
      locallyStoppedThreads.delete(threadId);
    }

    function markThreadLocallyStopped(threadId) {
      if (!threadId) return;
      const now = Date.now();
      locallyStoppedThreads.set(threadId, {
        at: now,
        until: now + LOCAL_STOP_SUPPRESS_MS,
      });
    }

    function isLocalStopSuppressed(threadId, startedAt = '') {
      if (!threadId) return false;
      const entry = locallyStoppedThreads.get(threadId);
      if (!entry) return false;
      if (Date.now() > entry.until) {
        locallyStoppedThreads.delete(threadId);
        return false;
      }
      const startedMs = Date.parse(startedAt || '');
      if (Number.isFinite(startedMs) && startedMs > entry.at + 1000) {
        locallyStoppedThreads.delete(threadId);
        return false;
      }
      return true;
    }

    function suppressRunningSnapshotAfterLocalStop(threadId, snapshot) {
      if (!snapshot || !isThreadRunningStatus(snapshot.status) || !isLocalStopSuppressed(threadId, snapshot.startedAt)) return snapshot;
      return {
        ...snapshot,
        status: 'idle',
        active: false,
        updatedAt: new Date().toISOString(),
      };
    }

    function setThreadCompleteNotice(threadId, active, completedAtMs = Date.now()) {
      if (!threadId) return;
      const before = completedThreadIds.has(threadId);
      const beforeAt = completedThreadNoticeTimes.get(threadId) || 0;
      if (active && threadId !== selectedThreadId) {
        completedThreadIds.add(threadId);
        completedThreadNoticeTimes.set(threadId, completedAtMs || Date.now());
      } else {
        completedThreadIds.delete(threadId);
        completedThreadNoticeTimes.delete(threadId);
      }
      if (before !== completedThreadIds.has(threadId) || beforeAt !== (completedThreadNoticeTimes.get(threadId) || 0)) persistCompletedThreadIds();
      updateTitleDotState();
    }

    function runtimeSnapshotFromThread(item) {
      if (!item) return null;
      const status = item.runtimeStatus || '';
      if (!status) return null;
      return {
        status,
        active: Boolean(item.runtimeActive || isThreadRunningStatus(status)),
        startedAt: item.runtimeStartedAt || '',
        completedAt: item.runtimeCompletedAt || '',
        updatedAt: item.runtimeUpdatedAt || item.effectiveUpdatedAt || item.updatedAt || '',
        turnId: item.runtimeTurnId || '',
      };
    }

    function applyThreadRuntimeState(threadId, snapshot, options = {}) {
      if (!threadId || !snapshot) return;
      snapshot = suppressRunningSnapshotAfterLocalStop(threadId, snapshot);
      const previous = threadRuntimeStates.get(threadId);
      threadRuntimeStates.set(threadId, snapshot);
      if (threadId === selectedThreadId) {
        setThreadCompleteNotice(threadId, false);
        return;
      }
      if (isThreadRunningStatus(snapshot.status)) {
        setThreadCompleteNotice(threadId, false);
        return;
      }
      if (!options.detectTransitions || !isThreadCompleteStatus(snapshot.status) || !previous) return;
      const wasRunning = isThreadRunningStatus(previous.status);
      const changedToComplete = previous.status !== snapshot.status && isThreadCompleteStatus(snapshot.status);
      const previousTime = Date.parse(previous.completedAt || previous.updatedAt || '') || 0;
      const currentTime = Date.parse(snapshot.completedAt || snapshot.updatedAt || '') || 0;
      const isRecentCompletion = Boolean(currentTime && Date.now() - currentTime <= THREAD_NOTICE_MAX_AGE_MS);
      if (isRecentCompletion && (wasRunning || changedToComplete || (currentTime && previousTime && currentTime > previousTime))) {
        setThreadCompleteNotice(threadId, true, currentTime);
      }
    }

    function formatDuration(ms = 0) {
      const total = Math.max(0, Math.floor(Math.max(0, Number(ms) || 0) / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return minutes ? `${minutes}m ${seconds}s` : `${seconds}s`;
    }

    function setMetaLabel(meta, label = '') {
      if (!meta) return;
      const text = String(label || '');
      const match = text.match(/^(.*?)(\d+m\s+\d+s|\d+s)$/);
      meta.textContent = '';
      if (!match) {
        meta.textContent = text;
        return;
      }
      meta.append(document.createTextNode(match[1] || ''));
      const duration = match[2] || '';
      let cursor = 0;
      for (const digitMatch of duration.matchAll(/\d+/g)) {
        const index = digitMatch.index || 0;
        if (index > cursor) meta.append(document.createTextNode(duration.slice(cursor, index)));
        const number = document.createElement('span');
        number.className = 'meta-duration-number';
        number.textContent = digitMatch[0];
        meta.append(number);
        cursor = index + digitMatch[0].length;
      }
      if (cursor < duration.length) meta.append(document.createTextNode(duration.slice(cursor)));
    }

    function parseTimeMs(value) {
      const parsed = Date.parse(value || '');
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function setActiveRunStart(startedAt = '', fallbackMs = Date.now()) {
      if (!activeAssistant || activeAssistant.runStartedAtMs) return;
      const parsed = parseTimeMs(startedAt);
      const startMs = parsed || fallbackMs;
      activeAssistant.runStartedAtMs = startMs;
      activeAssistant.runStartedAt = new Date(startMs).toISOString();
    }

    function activeRunDurationMs(endAt = '') {
      if (!activeAssistant) return 0;
      const startMs = Number(activeAssistant.runStartedAtMs) || parseTimeMs(activeAssistant.runStartedAt);
      if (!startMs) return 0;
      const endMs = parseTimeMs(endAt) || Date.now();
      return Math.max(0, endMs - startMs);
    }

    function finalRunDurationMs(data = {}) {
      const serverDuration = Number(data.durationMs);
      if (Number.isFinite(serverDuration) && serverDuration >= 0) return serverDuration;
      const timestampDuration = activeRunDurationMs(data.completedAt || data.updatedAt || '');
      if (timestampDuration) return timestampDuration;
      return activeRunDurationMs();
    }

    function updateActiveRunDuration(force = false) {
      if (!activeAssistant) return;
      const durationText = formatDuration(activeRunDurationMs());
      if (!force && durationText === activeAssistant.runDurationText) return;
      activeAssistant.runDurationText = durationText;
      const activeCommandUi = commandUi(activeAssistant.commandKind || '');
      if (activeAssistant.observing) {
        setMetaLabel(activeAssistant.meta, `Codex · 进度 ${durationText}`);
        setTopStatus('正在同步进度');
        return;
      }
      setMetaLabel(activeAssistant.meta, activeCommandUi ? activeCommandUi.runningLabel(durationText) : `Codex · 运行 ${durationText}`);
      setTopStatus(activeCommandUi ? activeCommandUi.runningNotice(durationText) : `Codex 正在回复 · ${durationText}`);
    }

    function startRunDurationTimer() {
      if (runDurationTimer) return;
      runDurationTimer = window.setInterval(() => updateActiveRunDuration(false), 1000);
    }

    function stopRunDurationTimer() {
      if (runDurationTimer) window.clearInterval(runDurationTimer);
      runDurationTimer = null;
    }

    function commandKindForText(text) {
      return String(text || '').trim() === CONTEXT_COMPACT_COMMAND ? 'compact' : '';
    }

    function commandUi(commandKind) {
      if (commandKind === 'compact') {
        return {
          userLabel: '你 · 压缩',
          pendingText: '正在压缩中…',
          runningLabel: durationText => `Codex · 压缩 ${durationText}`,
          completeLabel: durationText => `Codex · 已压缩 ${durationText}`,
          runningNotice: durationText => `正在压缩 · ${durationText}`,
          completeText: '已压缩。',
        };
      }
      return null;
    }

    function latestUserCommandKind() {
      const users = [...thread.querySelectorAll('.message.user .bubble')];
      const latest = users[users.length - 1];
      return commandKindForText(latest?.textContent || '');
    }

    function stepMarkdown(steps = []) {
      if (!steps.length) return '已发送，等待 Codex 开始回复…';
      return steps.map(step => {
        if (step.kind === 'tool') return `- **工具**：${step.text || ''}`;
        if (step.kind === 'thinking') return step.text || '正在分析请求';
        if (step.kind === 'start') return `- **开始**：${step.text || '开始处理'}`;
        if (step.kind === 'complete') return `- **完成**：${step.text || '回复完成'}`;
        if (step.kind === 'error') return `- **失败**：${step.text || 'Codex 回复失败'}`;
        return `- **${step.label || '事件'}**：${step.text || ''}`;
      }).join('\n\n');
    }

    function runningProgressSteps(data = {}, pendingText = '') {
      const steps = [...(Array.isArray(data.steps) ? data.steps : [])];
      const preview = String(data.preview || '').trim();
      const placeholder = /^(?:Codex (?:正在回复|App Server 正在后台处理)|等待 Codex App Server 输出|暂无可显示回复)[…。.]*$/;
      if (preview && !placeholder.test(preview) && !steps.some(step => step.kind === 'assistant' || step.text === preview)) {
        steps.push({ kind: 'assistant', label: '进度', text: preview });
      }
      if (!steps.length) steps.push({ kind: 'start', label: '状态', text: pendingText || (data.observing ? '等待新的任务进度…' : data.active ? '正在处理，等待新的进度…' : '已发送，等待 Codex 开始回复…') });
      if (data.progressUnavailable) steps.push({ kind: 'error', label: '同步', text: '进度暂时无法同步，正在重试…' });
      return steps;
    }

    function renderProcessSteps(el, steps = []) {
      if (!steps.length) return setMarkdown(el, '已发送，等待 Codex 开始回复…');
      const previousRects = new Map();
      el.querySelectorAll('.process-tool[data-tool-key]').forEach(node => {
        previousRects.set(node.dataset.toolKey, node.getBoundingClientRect());
      });

      el.innerHTML = '';
      const feed = document.createElement('div');
      feed.className = 'process-feed';
      let currentToolRow = null;
      let toolGroupIndex = -1;
      let toolIndexInGroup = 0;
      const animatedTools = [];

      const animateToolLayout = item => {
        const previous = previousRects.get(item.dataset.toolKey);
        const next = item.getBoundingClientRect();
        if (previous) {
          const dx = previous.left - next.left;
          if (Math.abs(dx) > 1) {
            item.style.transition = 'none';
            item.style.transform = `translateX(${dx}px)`;
            animatedTools.push(item);
          }
        } else {
          item.style.transition = 'none';
          item.style.opacity = '0';
          item.style.transform = 'translateX(-10px) scale(.98)';
          animatedTools.push(item);
        }
      };

      const appendToolGroup = group => {
        if (!group.length) return;
        currentToolRow = document.createElement('div');
        currentToolRow.className = 'process-tool-row';
        currentToolRow.setAttribute('aria-label', '工具调用过程，可左右滑动查看');
        feed.appendChild(currentToolRow);
        for (let i = group.length - 1; i >= 0; i -= 1) {
          const step = group[i];
          const item = document.createElement('div');
          item.className = 'process-tool';
          item.dataset.status = step.status || '';
          item.textContent = step.text || '调用工具';
          item.dataset.toolKey = step.callId || `${toolGroupIndex}:${i}:${step.text || ''}`;
          currentToolRow.appendChild(item);
        }
      };

      let pendingToolGroup = [];
      const flushToolGroup = () => {
        if (!pendingToolGroup.length) return;
        toolGroupIndex += 1;
        toolIndexInGroup = 0;
        appendToolGroup(pendingToolGroup.map(step => ({ ...step, __toolIndex: toolIndexInGroup++ })));
        pendingToolGroup = [];
      };

      for (const step of steps) {
        if (step.kind === 'tool') {
          pendingToolGroup.push(step);
          continue;
        }

        flushToolGroup();
        currentToolRow = null;
        const item = document.createElement('div');
        if (step.kind === 'thinking' || step.kind === 'assistant') {
          item.className = 'process-thinking markdown-body';
          const body = document.createElement('div');
          body.innerHTML = markdownToHtml(cleanAssistantMarkdown(step.text || '正在分析请求'));
          body.querySelectorAll('img[data-preview-id]').forEach(preparePreviewImage);
          item.append(body);
        } else {
          item.className = step.kind === 'complete' ? 'process-complete' : step.kind === 'error' ? 'process-error' : 'process-start';
          item.textContent = `${step.label || '事件'}：${step.text || ''}`;
        }
        feed.appendChild(item);
      }
      flushToolGroup();
      el.appendChild(feed);

      feed.querySelectorAll('.process-tool[data-tool-key]').forEach(animateToolLayout);
      if (animatedTools.length) {
        requestAnimationFrame(() => {
          for (const item of animatedTools) {
            item.style.transition = 'transform 220ms cubic-bezier(.2,.8,.2,1), opacity 160ms ease-out';
            item.style.transform = '';
            item.style.opacity = '';
          }
          window.setTimeout(() => {
            for (const item of animatedTools) item.style.transition = '';
          }, 260);
        });
      }
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('读取图片失败'));
        reader.readAsDataURL(file);
      });
    }

    const imageViewer = document.getElementById('image-viewer');
    const imageStage = document.getElementById('image-viewer-stage');
    const viewerImage = document.getElementById('image-viewer-image');
    const imageError = document.getElementById('image-viewer-error');
    const imagePointers = new Map();
    let imageScale = 1, imageX = 0, imageY = 0, imageGesture = null;

    function paintImageTransform() {
      imageScale = Math.max(1, Math.min(8, imageScale));
      const maxX = Math.max(0, (viewerImage.clientWidth * imageScale - imageStage.clientWidth) / 2);
      const maxY = Math.max(0, (viewerImage.clientHeight * imageScale - imageStage.clientHeight) / 2);
      imageX = Math.max(-maxX, Math.min(maxX, imageX)); imageY = Math.max(-maxY, Math.min(maxY, imageY));
      viewerImage.style.transform = `translate(${imageX}px, ${imageY}px) scale(${imageScale})`;
      document.getElementById('image-zoom-reset').textContent = `${Math.round(imageScale * 100)}%`;
      document.getElementById('image-zoom-out').disabled = imageScale <= 1;
      document.getElementById('image-zoom-in').disabled = imageScale >= 8;
    }
    function resetImageTransform() { imageScale = 1; imageX = 0; imageY = 0; imageGesture = null; imagePointers.clear(); paintImageTransform(); }
    function zoomImage(scale, x = 0, y = 0) {
      const next = Math.max(1, Math.min(8, scale));
      imageX = x - (x - imageX) * next / imageScale; imageY = y - (y - imageY) * next / imageScale;
      imageScale = next; paintImageTransform();
    }
    function imagePoint(event) {
      const rect = imageStage.getBoundingClientRect();
      return { x: event.clientX - rect.left - rect.width / 2, y: event.clientY - rect.top - rect.height / 2 };
    }
    function startImageGesture() {
      const points = [...imagePointers.values()];
      if (!points.length) { imageGesture = null; return; }
      const [a, b = a] = points;
      imageGesture = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, distance: Math.hypot(a.x - b.x, a.y - b.y), scale: imageScale, offsetX: imageX, offsetY: imageY };
    }
    imageStage.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      imagePointers.set(event.pointerId, imagePoint(event)); imageStage.setPointerCapture(event.pointerId); startImageGesture();
    });
    imageStage.addEventListener('pointermove', event => {
      if (!imagePointers.has(event.pointerId) || !imageGesture) return;
      imagePointers.set(event.pointerId, imagePoint(event));
      const [a, b = a] = [...imagePointers.values()];
      const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
      imageScale = imageGesture.distance ? Math.max(1, Math.min(8, imageGesture.scale * Math.hypot(a.x - b.x, a.y - b.y) / imageGesture.distance)) : imageGesture.scale;
      imageX = x - (imageGesture.x - imageGesture.offsetX) * imageScale / imageGesture.scale;
      imageY = y - (imageGesture.y - imageGesture.offsetY) * imageScale / imageGesture.scale;
      paintImageTransform();
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) imageStage.addEventListener(type, event => { imagePointers.delete(event.pointerId); startImageGesture(); });
    imageStage.addEventListener('wheel', event => { event.preventDefault(); const p = imagePoint(event); zoomImage(imageScale * Math.exp(-event.deltaY * .003), p.x, p.y); }, { passive: false });
    imageStage.addEventListener('dblclick', event => { const p = imagePoint(event); zoomImage(imageScale > 1 ? 1 : 2, p.x, p.y); });
    document.getElementById('image-zoom-in').addEventListener('click', () => zoomImage(imageScale * 1.5));
    document.getElementById('image-zoom-out').addEventListener('click', () => zoomImage(imageScale / 1.5));
    document.getElementById('image-zoom-reset').addEventListener('click', resetImageTransform);
    document.getElementById('image-viewer-close').addEventListener('click', () => imageViewer.close());
    imageViewer.addEventListener('close', () => { viewerImage.removeAttribute('src'); resetImageTransform(); });
    viewerImage.addEventListener('load', () => { if (imageViewer.open) { viewerImage.hidden = false; imageError.textContent = ''; paintImageTransform(); } });
    viewerImage.addEventListener('error', () => { if (imageViewer.open) { viewerImage.hidden = true; imageError.textContent = '图片无法加载，原文件可能已移除。请刷新聊天记录后重试。'; } });
    new ResizeObserver(() => { if (imageViewer.open) paintImageTransform(); }).observe(imageStage);
    function openImagePreview(img) {
      if (!img?.src) return;
      document.getElementById('image-viewer-name').textContent = img.alt || '图片';
      imageError.textContent = '正在加载图片…'; viewerImage.hidden = true; viewerImage.alt = img.alt;
      imageViewer.showModal(); resetImageTransform(); viewerImage.src = img.src;
    }
    function preparePreviewImage(img) {
      img.classList.add('image-open'); img.tabIndex = 0; img.setAttribute('role', 'button'); img.setAttribute('aria-label', `预览图片：${img.alt || '图片'}`);
      if (img.dataset.previewId) {
        img.src = apiUrl(`/codex/image?id=${encodeURIComponent(img.dataset.previewId)}&token=${encodeURIComponent(token)}`);
        img.loading = 'lazy';
        img.addEventListener('error', () => {
          const note = document.createElement('div'); note.className = 'attachment-note'; note.textContent = `图片无法加载：${img.alt || '图片'}`; img.replaceWith(note);
        }, { once: true });
      }
    }
    document.addEventListener('click', event => { const img = event.target.closest?.('img.image-open'); if (img) openImagePreview(img); });
    document.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches?.('img.image-open')) { event.preventDefault(); openImagePreview(event.target); }
    });

    function renderAttachmentTray() {
      attachmentTray.innerHTML = '';
      attachmentTray.classList.toggle('has-items', pendingAttachments.length > 0);
      pendingAttachments.forEach((item, index) => {
        const chip = document.createElement('div');
        const img = document.createElement('img');
        const remove = document.createElement('button');
        chip.className = 'attachment-chip';
        img.src = item.dataUrl;
        img.alt = item.name || '图片';
        preparePreviewImage(img);
        remove.type = 'button';
        remove.textContent = '×';
        remove.addEventListener('click', () => {
          pendingAttachments.splice(index, 1);
          renderAttachmentTray();
          if (!window.matchMedia('(max-width: 700px), (pointer: coarse)').matches) {
      textarea.focus({ preventScroll: true });
    }
        });
        chip.append(img, remove);
        attachmentTray.appendChild(chip);
      });
      updateComposerButtons();
    }

    function queuedSendSummary(text, attachments = []) {
      const replies = questionRepliesFromText(text);
      const body = replies.length ? replies.map(row => `${plainMarkdownText(row.question)}：${row.answer}`).join('；') : String(text || '').replace(/\s+/g, ' ').trim();
      const imageText = attachments.length ? `${attachments.length} 张图片` : '';
      if (body && imageText) return `${body} · ${imageText}`;
      return body || imageText || '空消息';
    }

    function queuedInputSummary(input = []) {
      const rows = Array.isArray(input) ? input : [];
      const text = rows.filter(item => item?.type === 'text').map(item => item.text || '').join(' ');
      const images = rows.filter(item => item?.type === 'localImage');
      return queuedSendSummary(text, images);
    }

    function renderQueuedSends() {
      const count = queuedSends.length;
      queuedSend.classList.toggle('is-visible', count > 0);
      queuedSendList.textContent = '';
      if (!count) {
        queuedSend.classList.remove('is-sending');
        queueWaitingForWriter = false;
        return;
      }
      const hasSending = queuedSends.some(item => item.state === 'sending');
      queuedSend.classList.toggle('is-sending', hasSending);
      queuedSendLabel.textContent = hasSending ? '正在排队' : queueWaitingForWriter ? `等待桌面端释放 · ${count}` : `排队 ${count}`;
      queueGuideButton.disabled = queueActionBusy || queuePaused || queueWaitingForWriter || !count;
      queueContinueButton.hidden = !queuePaused && !queueWaitingForWriter;
      queueContinueButton.disabled = queueActionBusy;
      queuedSends.forEach((item, index) => {
        const row = document.createElement('div');
        const rank = document.createElement('span');
        const text = document.createElement('span');
        const remove = document.createElement('button');
        row.className = 'queued-send-item';
        rank.className = 'queued-send-rank';
        text.className = 'queued-send-text';
        remove.className = 'queue-delete';
        rank.textContent = index === 0 ? '队首消息' : `#${index + 1}`;
        const replies = item.questionReplies || questionRepliesFromText((item.input || []).filter(part => part.type === 'text').map(part => part.text || '').join('\n'));
        if (replies.length) renderQuestionReply(text, replies);
        else text.textContent = item.summary || queuedInputSummary(item.input);
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = '删除这条排队消息';
        remove.disabled = queueActionBusy || item.localOnly;
        remove.addEventListener('click', event => {
          event.preventDefault();
          deleteQueuedMessage(item.id);
        });
        row.append(rank, text, remove);
        queuedSendList.appendChild(row);
      });
    }

    function addQueuedSend(text, attachments = [], state = 'sending', options = {}) {
      const id = `queued-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      queuedSends.push({ id, text, questionReplies: options.questionReplies, attachments: [...attachments], summary: queuedSendSummary(text, attachments), state, localOnly: true, commandKind: options.commandKind || commandKindForText(text) });
      renderQueuedSends();
      return id;
    }

    function updateQueuedSend(id, state = 'queued') {
      const item = queuedSends.find(row => row.id === id);
      if (!item) return;
      item.state = state;
      renderQueuedSends();
    }

    function removeQueuedSend(id) {
      queuedSends = queuedSends.filter(row => row.id !== id);
      renderQueuedSends();
    }

    function clearQueuedSends() {
      queuedSends = [];
      queuePaused = false;
      queueWaitingForWriter = false;
      renderQueuedSends();
    }

    async function loadQueue(threadId = selectedThreadId) {
      if (!threadId) {
        clearQueuedSends();
        return;
      }
      const response = await fetchApi(`/codex/queue?thread=${encodeURIComponent(threadId)}&limit=100&token=${encodeURIComponent(token)}`, { cache: 'no-store' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.message || '读取队列失败');
      if (threadId !== selectedThreadId) return;
      queuedSends = (data.queue || []).map(item => ({
        ...item,
        summary: queuedInputSummary(item.input),
        state: 'queued',
        localOnly: false,
      }));
      queuePaused = Boolean(data.paused);
      queueWaitingForWriter = Boolean(data.waitingForWriter);
      threadQueueCounts.set(threadId, queuedSends.length);
      renderQueuedSends();
      renderThreadMenuIfVisualChanged();
    }

    async function runQueueAction(action, extra = {}) {
      if (!selectedThreadId || queueActionBusy) return;
      queueActionBusy = true;
      renderQueuedSends();
      try {
        const response = await fetchApi('/codex/queue', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-mobile-typer-token': token },
          body: JSON.stringify({ action, threadId: selectedThreadId, ...extra }),
          apiTimeoutMs: 30000,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.message || '队列操作失败');
        setNotice(data.message || '队列已更新', 'ok');
        await loadQueue();
        if (action === 'continue') refreshCurrentThreadIfChanged().catch(() => {});
      } catch (error) {
        setNotice(error.message || '队列操作失败', 'error');
      } finally {
        queueActionBusy = false;
        renderQueuedSends();
      }
    }

    function deleteQueuedMessage(id) {
      if (!id) return;
      return runQueueAction('delete', { queuedSubmissionId: id });
    }

    queueGuideButton.addEventListener('click', () => runQueueAction('guide', {
      clientUserMessageId: `steer-${Date.now()}-${Math.random().toString(36).slice(2)}`,
    }));
    queueContinueButton.addEventListener('click', () => runQueueAction('continue'));

    function approvalDescription(item) {
      const params = item?.params || {};
      if (Array.isArray(params.command)) return params.command.join(' ');
      if (params.command) return String(params.command);
      if (Array.isArray(params.questions)) return params.questions.map(question => question.question).join('\n');
      return String(params.reason || 'Codex 需要你的确认后才能继续。');
    }

    function appOwnsQuestion(item) {
      return item?.method === 'desktop/requestUserInput' || item?.responseOwner === 'codex-app';
    }

    function applyApprovalSnapshot(data, sequence, threadId = selectedThreadId) {
      if (threadId !== selectedThreadId || !Array.isArray(data?.approvals) || !sequence || sequence < lastApprovalReadSequence) return;
      lastApprovalReadSequence = sequence;
      // Older servers mixed historical App prompts into native approvals.
      renderApproval(data.approvals.find(item => !appOwnsQuestion(item)) || null);
      renderDesktopQuestionHistory([...(data.desktopQuestions || []), ...data.approvals.filter(appOwnsQuestion)]);
    }

    function resetApproval() {
      lastApprovalReadSequence = ++approvalReadSequence;
      renderApproval(null);
      renderDesktopQuestionHistory([]);
    }

    async function submitApproval(item, responsePayload) {
      if (!item || currentApproval?.id !== item.id) return;
      item = currentApproval;
      if (!item || item.submittedAt || approvalActionBusy) return;
      if (appOwnsQuestion(item) || item.canSubmit === false) {
        setNotice(appOwnsQuestion(item) ? '这是历史提问，无法确认当前是否仍可回答。' : '这条问题当前不可回答，正在同步最新状态。', 'ok');
        return;
      }
      approvalActionBusy = true;
      approvalPanel.querySelectorAll('button, input, select, textarea').forEach(field => { field.disabled = true; });
      try {
        const response = await fetchApi('/codex/approvals', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-mobile-typer-token': token },
          body: JSON.stringify({ id: item.id, response: responsePayload }),
          apiTimeoutMs: 30000,
          retryRoute: false,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.message || '提交审批失败');
        setNotice(data.message || '已提交审批结果', 'ok');
        await loadApprovals();
      } catch (error) {
        setNotice(error.message || '提交审批失败', 'error');
      } finally {
        approvalActionBusy = false;
        if (!currentApproval?.submittedAt) {
          approvalPanel.querySelectorAll('button, input, select, textarea').forEach(field => { field.disabled = false; });
          approvalPanel.querySelector('.question-submit')?.dispatchEvent(new Event('questionvalidate'));
        }
      }
    }

    function approvalButton(label, onClick) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.disabled = approvalActionBusy;
      button.addEventListener('click', onClick);
      return button;
    }

    function appendReadonlyQuestions(detail, questions) {
      for (const question of questions) {
        const field = document.createElement('div');
        const prompt = document.createElement('div');
        field.className = 'question-field';
        prompt.className = 'question-prompt markdown-body';
        setMarkdown(prompt, question.question || question.header || '问题');
        field.appendChild(prompt);
        if (question.options?.length) {
          const choices = document.createElement('ol');
          choices.className = 'question-app-options';
          for (const option of question.options) {
            const row = document.createElement('li');
            row.textContent = typeof option === 'string' ? option : option.label;
            choices.appendChild(row);
          }
          field.appendChild(choices);
        }
        detail.appendChild(field);
      }
    }

    function desktopQuestionDismissalKey(threadId) {
      return `codexMini.closedQuestions.v1:${deviceStorageScope || currentApiBase}:${threadId}`;
    }

    function closedDesktopQuestions(threadId) {
      const key = desktopQuestionDismissalKey(threadId);
      if (!closedDesktopQuestionCache.has(key)) {
        let ids = [];
        try {
          const saved = JSON.parse(localStorage.getItem(key) || '[]');
          if (Array.isArray(saved)) ids = saved.filter(id => typeof id === 'string');
        } catch {}
        closedDesktopQuestionCache.set(key, new Set(ids));
      }
      return closedDesktopQuestionCache.get(key);
    }

    function saveClosedDesktopQuestions(threadId, ids) {
      const key = desktopQuestionDismissalKey(threadId);
      closedDesktopQuestionCache.set(key, ids);
      try {
        if (ids.size) localStorage.setItem(key, JSON.stringify([...ids]));
        else localStorage.removeItem(key);
        return true;
      } catch { return false; }
    }

    function dismissDesktopQuestionHistory(threadId, questionIds) {
      if (threadId !== selectedThreadId) return;
      const ids = new Set(closedDesktopQuestions(threadId));
      for (const id of questionIds) ids.add(id);
      const saved = saveClosedDesktopQuestions(threadId, ids);
      renderDesktopQuestionHistory(desktopQuestionHistoryItems);
      threadButton.focus({ preventScroll: true });
      setNotice(saved ? '已关闭历史提问；长按对话标题可重新显示' : '已关闭，但浏览器未能保存设置，刷新后可能重新显示', saved ? 'ok' : 'error');
    }

    function restoreDesktopQuestionHistory() {
      const threadId = actionThreadId || selectedThreadId;
      const saved = saveClosedDesktopQuestions(threadId, new Set());
      closeThreadActionCard();
      if (threadId === selectedThreadId) renderDesktopQuestionHistory(desktopQuestionHistoryItems);
      setNotice(saved ? '已恢复此对话的历史提问显示' : '已恢复显示，但浏览器未能保存设置', saved ? 'ok' : 'error');
    }

    function renderDesktopQuestionHistory(items = []) {
      desktopQuestionHistoryItems = items;
      const closed = closedDesktopQuestions(selectedThreadId);
      const groups = [...new Map(items.filter(item => item?.params?.questions?.length && !closed.has(item.id)).map(item => [item.id, item])).values()];
      const signature = JSON.stringify([selectedThreadId, groups]);
      if (signature === desktopQuestionHistorySignature) return;
      const wasOpen = desktopQuestionHistoryThreadId === selectedThreadId && desktopQuestionHistory.querySelector('details')?.open;
      desktopQuestionHistorySignature = signature;
      desktopQuestionHistoryThreadId = selectedThreadId;
      desktopQuestionHistory.replaceChildren();
      desktopQuestionHistory.classList.toggle('is-visible', groups.length > 0);
      if (!groups.length) return;
      const questions = groups.flatMap(item => item.params.questions);
      const disclosure = document.createElement('details');
      const summary = document.createElement('summary');
      const detail = document.createElement('div');
      const note = document.createElement('p');
      const close = document.createElement('button');
      const historyThreadId = selectedThreadId;
      close.type = 'button';
      close.className = 'question-history-close';
      close.textContent = '×';
      close.setAttribute('aria-label', '关闭历史提问卡片');
      close.title = '仅在此浏览器隐藏，可在对话菜单中重新显示';
      close.addEventListener('click', () => dismissDesktopQuestionHistory(historyThreadId, groups.map(item => item.id)));
      summary.className = 'question-history-summary';
      summary.textContent = `历史提问 ${questions.length} · 状态未确认`;
      detail.className = 'approval-detail';
      note.className = 'question-help question-app-note';
      note.textContent = '以下来自对话历史，无法确认 App 中是否仍可回答。';
      detail.appendChild(note);
      appendReadonlyQuestions(detail, questions);
      disclosure.open = Boolean(wasOpen);
      disclosure.append(summary, detail);
      desktopQuestionHistory.append(disclosure, close);
    }

    function renderApproval(item) {
      if (appOwnsQuestion(item)) {
        renderApproval(null);
        renderDesktopQuestionHistory([item]);
        return;
      }
      const questionInQueue = item?.method === 'desktop/requestUserInput' && item.submissionState === 'queued' && queuedSends.length > 0;
      const signature = JSON.stringify([selectedThreadId, item?.id, item?.method, item?.params, item?.submittedAt, item?.submissionState, item?.responseOwner, item?.canSubmit, questionInQueue]);
      if (signature === approvalRenderSignature) return;
      approvalRenderSignature = signature;
      currentApproval = item;
      approvalPanel.textContent = '';
      approvalPanel.classList.remove('is-collapsed');
      approvalPanel.classList.toggle('is-visible', Boolean(item) && !questionInQueue);
      const isQuestion = ['item/tool/requestUserInput', 'desktop/requestUserInput'].includes(item?.method);
      approvalPanel.classList.toggle('is-question', isQuestion);
      if (!item || questionInQueue) return;
      const title = document.createElement('div');
      const detail = document.createElement('div');
      const actions = document.createElement('div');
      title.className = 'approval-title';
      detail.className = 'approval-detail';
      actions.className = 'approval-actions';
      title.textContent = item.submittedAt ? '审批结果待确认' : item.method === 'item/tool/requestUserInput' ? 'Codex 需要你的回答' : '帮我批准';
      detail.textContent = isQuestion ? '' : item.submittedAt ? `${approvalDescription(item)}\n已提交，等待 Codex 确认。` : approvalDescription(item);
      if (item.submittedAt && !isQuestion) {
        approvalPanel.append(title, detail);
        return;
      }
      if (isQuestion) {
        title.textContent = item.submittedAt ? item.submissionState === 'queued' ? '回答已排队' : item.submissionState === 'uncertain' ? '发送结果待确认' : '回答已提交' : '问题';
        const header = document.createElement('div');
        header.className = 'question-header';
        header.appendChild(title);
        if (item.submittedAt) {
          const note = document.createElement('div');
          note.className = 'question-help';
          note.textContent = item.submissionState === 'queued' ? '等待当前任务继续。' : '正在确认送达状态，请勿重复提交。';
          detail.appendChild(note);
          approvalPanel.append(header, detail);
          return;
        }
        if (item.canSubmit === false) {
          title.textContent = '问题 · 暂不可回答';
          appendReadonlyQuestions(detail, item.params?.questions || []);
          const note = document.createElement('p');
          note.className = 'question-help';
          note.classList.add('question-app-note');
          note.textContent = '正在同步最新状态，请稍候。';
          detail.appendChild(note);
          approvalPanel.append(header, detail);
          return;
        }
        const close = approvalButton('×', () => collapse(true));
        close.className = 'question-close';
        close.setAttribute('aria-label', '收起问题，稍后回答');
        const reopen = approvalButton('继续回答', () => collapse(false));
        reopen.className = 'question-reopen';
        reopen.hidden = true;
        const collapse = collapsed => {
          approvalPanel.classList.toggle('is-collapsed', collapsed);
          close.hidden = collapsed;
          reopen.hidden = !collapsed;
          (collapsed ? reopen : close).focus({ preventScroll: true });
        };
        header.append(reopen, close);
        const fields = new Map();
        const submit = approvalButton('发送', () => {
          const answers = {};
          for (const [id, field] of fields) {
            const value = field.value();
            if (!value.trim()) { setNotice('请回答每一个问题后再发送。', 'error'); field.focus(); return; }
            answers[id] = { answers: [value] };
          }
          submitApproval(item, { answers });
        });
        submit.className = 'question-submit';
        submit.setAttribute('aria-label', '发送回答');
        const refreshSubmit = () => { submit.disabled = approvalActionBusy || !fields.size || [...fields.values()].some(field => !field.value().trim()); };
        submit.addEventListener('questionvalidate', refreshSubmit);
        for (const [questionIndex, question] of (item.params?.questions || []).entries()) {
          const field = document.createElement('div');
          const prompt = document.createElement('div');
          field.className = 'question-field';
          prompt.className = 'question-prompt markdown-body';
          prompt.id = `question-prompt-${questionIndex}`;
          setMarkdown(prompt, question.question || question.header || '回答');
          field.appendChild(prompt);
          detail.appendChild(field);
          const options = question.options || [];
          const input = document.createElement(question.isSecret ? 'input' : 'textarea');
          if (question.isSecret) input.type = 'password';
          else input.rows = 1;
          input.setAttribute('aria-label', `${plainMarkdownText(question.question || question.header || '问题')} · 自定义回答`);
          input.placeholder = options.length ? '或自行撰写回复' : '撰写回复';
          let selected = -1;
          const choices = [];
          const optionLabel = index => typeof options[index] === 'string' ? options[index] : options[index]?.label || '';
          const updateChoice = () => {
            choices.forEach((button, index) => {
              button.setAttribute('aria-checked', String(index === selected));
              button.tabIndex = index === Math.max(0, selected) ? 0 : -1;
            });
            refreshSubmit();
          };
          const selectChoice = index => {
            selected = index;
            input.value = '';
            input.style.height = '';
            updateChoice();
          };
          if (options.length) {
            const list = document.createElement('div');
            list.className = 'question-options';
            list.setAttribute('role', 'radiogroup');
            list.setAttribute('aria-labelledby', prompt.id);
            options.forEach((option, index) => {
              const button = approvalButton('', () => selectChoice(index));
              const number = document.createElement('span');
              const copy = document.createElement('span');
              button.className = 'question-option';
              button.tabIndex = index === 0 ? 0 : -1;
              button.setAttribute('role', 'radio');
              button.setAttribute('aria-checked', 'false');
              number.className = 'question-option-number';
              number.setAttribute('aria-hidden', 'true');
              number.textContent = String(index + 1);
              copy.className = 'question-option-copy';
              copy.textContent = optionLabel(index);
              if (option.description) {
                const description = document.createElement('span');
                description.className = 'question-option-description';
                description.textContent = option.description;
                copy.appendChild(description);
              }
              button.append(number, copy);
              button.addEventListener('keydown', event => {
                if (!['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'].includes(event.key)) return;
                event.preventDefault();
                const next = (index + (['ArrowDown', 'ArrowRight'].includes(event.key) ? 1 : -1) + choices.length) % choices.length;
                selectChoice(next);
                choices[next].focus();
              });
              choices.push(button);
              list.appendChild(button);
            });
            field.appendChild(list);
          }
          const allowsCustom = !options.length || question.isOther !== false;
          if (allowsCustom) {
            const custom = document.createElement('div');
            const icon = document.createElement('span');
            custom.className = 'question-custom';
            icon.className = 'question-custom-icon';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = '✎';
            custom.append(icon, input);
            field.appendChild(custom);
            input.addEventListener('input', () => {
              selected = -1;
              input.style.height = 'auto';
              input.style.height = `${Math.min(110, input.scrollHeight)}px`;
              updateChoice();
            });
            input.addEventListener('keydown', event => {
              if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && !event.isComposing && !submit.disabled) {
                event.preventDefault(); submit.click();
              }
            });
          }
          fields.set(question.id, { value: () => selected >= 0 ? optionLabel(selected) : input.value,
            focus: () => (allowsCustom ? input : choices[0])?.focus() });
        }
        const defer = approvalButton('稍后回答', () => collapse(true));
        defer.className = 'question-defer';
        actions.append(defer, submit);
        refreshSubmit();
        approvalPanel.append(header, detail, actions);
        return;
      } else if (item.method === 'item/permissions/requestApproval') {
        actions.appendChild(approvalButton('允许本轮', () => submitApproval(item, { permissions: item.params.permissions, scope: 'turn' })));
        actions.appendChild(approvalButton('允许本次会话', () => submitApproval(item, { permissions: item.params.permissions, scope: 'session' })));
      } else if (item.method === 'execCommandApproval' || item.method === 'applyPatchApproval') {
        actions.appendChild(approvalButton('允许', () => submitApproval(item, { decision: 'approved' })));
        actions.appendChild(approvalButton('拒绝', () => submitApproval(item, { decision: { denied: { rejection: 'User declined in Codex Relay.' } } })));
      } else {
        actions.appendChild(approvalButton('允许', () => submitApproval(item, { decision: 'accept' })));
        actions.appendChild(approvalButton('本次会话允许', () => submitApproval(item, { decision: 'acceptForSession' })));
        actions.appendChild(approvalButton('拒绝', () => submitApproval(item, { decision: 'decline' })));
      }
      approvalPanel.append(title, detail, actions);
    }

      if (!response.ok || !data.ok) throw new Error(data.message || '读取审批请求失败');

    function captureVisibleProcessSteps(message) {
      if (!message?.bubble) return [];
      const steps = [];
      for (const node of [...message.bubble.querySelectorAll('.process-start, .process-complete, .process-error, .process-thinking, .process-tool')]) {
        const text = node.textContent.replace(/\s+/g, ' ').trim();
        if (!text) continue;
        let label = '过程';
        if (node.classList.contains('process-thinking')) label = '思考';
        else if (node.classList.contains('process-tool')) label = '工具';
        else if (node.classList.contains('process-start')) label = '开始';
        else if (node.classList.contains('process-complete')) label = '完成';
        else if (node.classList.contains('process-error')) label = '失败';
        steps.push({ label, text });
      }
      const plain = message.bubble.textContent.replace(/\s+/g, ' ').trim();
      if (!steps.length && plain && plain !== '已发送，等待 Codex 开始回复…' && plain !== 'Codex 正在回复…') {
        steps.push({ label: '已生成内容', text: plain });
      }
      return steps;
    }

    function formatRelativeTime(value) {
      const then = Date.parse(value || '');
      if (!Number.isFinite(then)) return '';
      const seconds = Math.max(0, Math.floor((Date.now() - then) / 1000));
      if (seconds < 60) return '刚刚';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} 分钟`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} 小时`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} 天`;
      const weeks = Math.floor(days / 7);
      if (weeks < 8) return `${weeks} 周`;
      const months = Math.floor(days / 30);
      if (months < 12) return `${months} 个月`;
      return `${Math.floor(days / 365)} 年`;
    }

    function sortThreadsByTime(items) {
      return [...items].sort((a, b) => (Date.parse(b.effectiveUpdatedAt || b.updatedAt || '') || b.effectiveUpdatedMs || 0) - (Date.parse(a.effectiveUpdatedAt || a.updatedAt || '') || a.effectiveUpdatedMs || 0));
    }

    function projectThreadPreviewLimit() {
      const height = viewportHeight();
      if (!height) return PROJECT_THREAD_PREVIEW_LIMIT;
      return Math.max(3, Math.min(10, Math.floor((height - 250) / 58)));
    }

    function threadMenuStateForItem(item) {
      const runtime = threadRuntimeStates.get(item.id) || runtimeSnapshotFromThread(item) || {};
      if (isThreadRunningStatus(runtime.status)) return 'running';
      if (completedThreadIds.has(item.id) && item.id !== selectedThreadId) return 'done';
      return 'time';
    }

    function threadMenuVisualSignature() {
      const threadPart = flattenKnownThreads()
        .sort((a, b) => String(a.id || '').localeCompare(String(b.id || '')))
        .map(item => `${item.id}:${item.name || ''}:${item.projectKey || ''}:${item.projectName || ''}:${item.isProjectThread}:${formatRelativeTime(item.effectiveUpdatedAt || item.updatedAt)}:${item.pinned ? 'pinned' : 'normal'}:${threadMenuStateForItem(item)}:q${threadQueueCounts.get(item.id) || 0}`)
        .join('|');
      const openPart = [...openProjectKeys].sort().join(',');
      const expandedPart = [...expandedProjectThreadKeys].sort().join(',');
      const pagesPart = Object.entries(threadPages).map(([scope, page]) => `${scope}:${page.nextCursor || ''}:${page.loaded}:${Boolean(page.request)}:${page.error || ''}`).join('|');
      return `${selectedThreadId}::${openPart}::${expandedPart}::${threadPart}::${pagesPart}::${threadMenuView}::${threadSearchQuery}`;
    }

    function renderThreadMenuIfVisualChanged() {
      if (threadMenuVisualSignature() !== lastThreadMenuSignature) renderThreadMenu();

    function wireThreadMenuItemInteractions(button, item) {
      let timer = 0;
      let startPoint = null;
      let longPressOpened = false;
      let handledAt = 0;
      const cancel = () => {
        window.clearTimeout(timer);
        timer = 0;
        startPoint = null;
      };
      button.addEventListener('pointerdown', event => {
        if (event.button > 0) return;
        startPoint = { x: event.clientX || 0, y: event.clientY || 0 };
        longPressOpened = false;
        window.clearTimeout(timer);
        timer = window.setTimeout(() => {
          longPressOpened = true;
          handledAt = Date.now();
          clearNativeSelection();
          openThreadActionCard(item.id, { anchorElement: button, keepThreadMenu: true, vibrate: true });
        }, 560);
      });
      button.addEventListener('pointermove', event => {
        if (!startPoint) return;
        const dx = Math.abs((event.clientX || 0) - startPoint.x);
        const dy = Math.abs((event.clientY || 0) - startPoint.y);
        if (dx > 10 || dy > 10) cancel();
      });
      button.addEventListener('pointerup', event => {
        if (event.cancelable) event.preventDefault();
        event.stopPropagation();
        const shouldSelect = Boolean(startPoint && !longPressOpened);
        cancel();
        handledAt = Date.now();
        if (shouldSelect) selectThread(item.id);
      });
      button.addEventListener('pointercancel', cancel);
      button.addEventListener('contextmenu', event => {
        event.preventDefault();
        event.stopPropagation();
        cancel();
        handledAt = Date.now();
        clearNativeSelection();
        openThreadActionCard(item.id, { anchorElement: button, keepThreadMenu: true, vibrate: true });
      });
      button.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        if (Date.now() - handledAt < 700) return;
        selectThread(item.id);
      });
    }

        if (queueCount) state.append(` +${queueCount}`);

      }
      button.append(name, state);
      wireThreadMenuItemInteractions(button, item);
      parent.appendChild(button);
      if (!isChild) {
        for (const child of item.children || []) appendThreadOption(parent, child, true, true);

    function createThreadSection(scope, searching, selectedProject) {
      const title = scope === 'projects' ? '项目' : '对话';

      const section = document.createElement('section');
      const heading = document.createElement('div');
      const label = document.createElement('button');
      const create = document.createElement('button');

      const footer = document.createElement('div');

      section.setAttribute('aria-label', `${title}会话`);
      heading.className = 'thread-section-heading';
      label.className = 'thread-section-label thread-section-toggle';

      label.dataset.focusKey = `section:${scope}`;

        create.title = selectedProject ? `在 ${selectedProject.name} 下创建对话` : '先选择一个项目';

        create.dataset.focusKey = 'new-conversation';
        create.textContent = '新建对话';
        create.title = '创建无项目的新对话';
        create.addEventListener('click', () => createNewThreadInCurrentProject({ forceConversation: true }));
      }
      body.className = 'thread-section-body';
      body.id = `thread-section-${scope}`;
      body.dataset.scrollKey = scope;
      body.hidden = collapsed;
      body.addEventListener('scroll', () => {
        if (threadMenuList.dataset.view !== 'search') threadSectionScroll[`${threadMenuView}:${scope}`] = body.scrollTop;
        scheduleThreadBrowserCache();
        scheduleThreadMenuFill();
      }, { passive: true });
      footer.className = 'thread-section-footer';
      heading.append(label, create);
      section.append(heading, body);
      if (!collapsed) {
        appendMoreThreadsButton(footer, scope);
        section.appendChild(footer);
      }
      return { section, body };
    }

    function filterThreadItems(items, query, inheritedProject = '') {
      const terms = query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
      if (!terms.length) return items;
      const result = [];
      for (const item of items) {
        const project = item.isProjectThread ? item.projectName || inheritedProject : inheritedProject;
        const text = `${item.name || ''} ${project}`.toLocaleLowerCase();
        const children = filterThreadItems(item.children || [], query, project);
        if (terms.every(term => text.includes(term))) result.push(item);
        else if (children.length) result.push({ ...item, children });
      }
      return result;
    }

    function renderThreadMenu() {
      const focusedKey = threadMenuList.contains(document.activeElement) ? document.activeElement.dataset.focusKey : '';
      const scrollTop = threadMenuList.scrollTop;
      if (threadMenuList.dataset.view !== 'search') {
        for (const node of threadMenuList.querySelectorAll('[data-scroll-key]')) {
          if (!node.hidden) threadSectionScroll[`${threadMenuList.dataset.view}:${node.dataset.scrollKey}`] = node.scrollTop;
        }
      }
      renderThreadMenuContents();
      if (focusedKey) {
        const replacement = [...threadMenuList.querySelectorAll('[data-focus-key]')].find(button => button.dataset.focusKey === focusedKey && !button.disabled);
        const scope = focusedKey.startsWith('more:') ? focusedKey.slice(5) : threadMenuView;
        (replacement || threadMenuList.querySelector(`[data-focus-key="section:${scope}"]:not(:disabled)`) || threadSearch).focus({ preventScroll: true });
      }
      threadMenuList.scrollTop = scrollTop;
      if (threadMenuList.dataset.view !== 'search') {
        for (const node of threadMenuList.querySelectorAll('[data-scroll-key]')) {
          if (!node.hidden) node.scrollTop = threadSectionScroll[`${threadMenuList.dataset.view}:${node.dataset.scrollKey}`] || 0;
        }
      }
      scheduleThreadBrowserCache();
      scheduleThreadMenuFill();
    }

    function threadSectionNeedsMore(scope, retry = false) {
      if (!clientReady || document.hidden || threadSearchQuery.trim() || Date.now() < apiPauseUntil || threadAutoFillPaused.has(scope)) return false;
      const page = threadPages[scope];
      if (!page.loaded || !page.nextCursor || page.request || (page.error && retry !== true)) return false;
      const body = document.getElementById(`thread-section-${scope}`);
      return Boolean(body && !body.hidden && body.clientHeight > 0 && body.scrollHeight - body.clientHeight - body.scrollTop < 100);
    }

    function scheduleThreadMenuFill() {
      window.clearTimeout(threadFillTimer);
      threadFillTimer = window.setTimeout(fillThreadMenu, 100);
    }

    async function fillThreadMenu() {
      if (threadFillPromise) return threadFillPromise;
      threadFillPromise = (async () => {
        // Empty filtered native pages can still have a cursor. Bound each burst
        // so a sparse project category cannot scan the entire account unasked.
        for (let count = 0; count < 10; count++) {
          const scopes = ['projects', 'conversations'].filter(scope => threadSectionNeedsMore(scope));
          if (!scopes.length) return;
          for (const scope of scopes) {
            if (!threadSectionNeedsMore(scope)) continue;
            const cursor = threadPages[scope].nextCursor;
            for (let attempt = 0; attempt < 2; attempt++) {
              try { await loadThreads({ scope, more: true, renderMenu: 'ifChanged' }); break; }
              catch {
                if (attempt || !threadSectionNeedsMore(scope, true)) { threadAutoFillPaused.add(scope); break; }
                await new Promise(resolve => window.setTimeout(resolve, 1500));
                if (!threadSectionNeedsMore(scope, true)) break;
              }
            }
            if (threadPages[scope].nextCursor === cursor) threadAutoFillPaused.add(scope);
          }
        }
        for (const scope of ['projects', 'conversations']) if (threadSectionNeedsMore(scope)) threadAutoFillPaused.add(scope);
      })();
      try { await threadFillPromise; }
      finally { threadFillPromise = null; }
    }

    function renderThreadMenuContents() {
      threadMenuList.innerHTML = '';
      const items = filterThreadItems(knownThreads, threadSearchQuery);
      const searching = Boolean(threadSearchQuery.trim());
      const hasMore = Object.values(threadPages).some(page => page.nextCursor || !page.loaded);
      threadMenu.classList.toggle('is-searching', searching);
      threadMenuList.dataset.view = searching ? 'search' : threadMenuView;
      threadSearchClear.hidden = !threadSearchQuery;
      threadSearchSummary.textContent = searching
        ? `在已加载的 ${flattenKnownThreads().length} 个任务中搜索${hasMore ? ' · 可继续加载更早任务' : ''}`
        : '';
      if (!items.length && searching && !hasMore) {
        const empty = document.createElement('div');
        empty.className = 'empty-thread-menu';
        empty.textContent = '没有匹配的任务。试试其他任务或项目名称。';
        threadMenuList.appendChild(empty);
      }

      const current = flattenKnownThreads().find(item => item.id === selectedThreadId);
      const currentProjectKey = selectedProjectKey || (current?.isProjectThread ? current.projectKey : '');
      const projectMap = new Map();
      const conversations = [];
      const pinnedThreads = sortThreadsByTime(items.filter(item => item.pinned));

      for (const item of items) {
        if (item.pinned) continue;
        if (!item.isProjectThread) {
          conversations.push(item);
          continue;
        }
        const key = item.projectKey || item.projectPath || item.cwd || 'project';
        if (!projectMap.has(key)) {
          projectMap.set(key, {
            key,
            name: item.projectName || '未命名项目',
            path: item.projectPath || item.cwd || '',
            latest: 0,
            items: [],
          });
        }
        const group = projectMap.get(key);
        group.items.push(item);
        group.latest = Math.max(group.latest, Date.parse(item.effectiveUpdatedAt || item.updatedAt || '') || item.effectiveUpdatedMs || 0);
      }

      const projectGroups = [...projectMap.values()].sort((a, b) => b.latest - a.latest);
      if (!searching && !hasSavedProjectGroupState && projectGroups.length && !openProjectKeys.size) {
        openProjectKeys.add(currentProjectKey || projectGroups[0].key);
        persistOpenProjectKeys();
      }

      const sections = new Map();
      for (const scope of ['projects', 'conversations']) {
        const pinned = pinnedThreads.filter(item => Boolean(item.isProjectThread) === (scope === 'projects'));
        const hasItems = pinned.length || (scope === 'projects' ? projectGroups.length : conversations.length);
        if (searching && !hasItems && !threadPages[scope].nextCursor && threadPages[scope].loaded) continue;
        const { section, body } = createThreadSection(scope, searching, projectGroups.find(group => group.key === currentProjectKey));
        pinned.forEach(item => appendPinnedThreadOption(body, item));
        if (scope === 'projects') {
          projectGroups.forEach(group => appendProjectGroup(body, group, group.key === currentProjectKey));
        } else {
          const list = document.createElement('div');
          list.className = 'thread-list';
          for (const item of sortThreadsByTime(conversations)) appendThreadOption(list, item, true);
          body.appendChild(list);
        }
        if (!hasItems) {
          const empty = document.createElement('div');
          empty.className = 'empty-thread-menu';
          empty.textContent = threadPages[scope].request ? '正在读取会话…' : searching ? '暂未找到匹配会话，可加载更早记录。'
            : threadPages[scope].nextCursor ? '这批记录中没有此类会话，可继续加载。' : '暂无会话。';
          body.appendChild(empty);
        }
        sections.set(scope, section);
      }
      for (const scope of ['projects', 'conversations']) if (sections.has(scope)) threadMenuList.appendChild(sections.get(scope));
      lastThreadMenuSignature = threadMenuVisualSignature();
      positionThreadMenuCard();
    }

    function selectedThreadPlaceholder(threadId) {
      const now = new Date().toISOString();
      return {
        id: threadId,
        name: '当前新对话',
        updatedAt: now,
        effectiveUpdatedAt: now,
        effectiveUpdatedMs: Date.now(),
        cwd: '',
        projectPath: '',
        projectKey: 'conversation',
        projectName: '对话',
        isProjectThread: false,
        pinned: false,
      };
    }

    async function loadThreadPage(scope, options = {}) {
      const page = threadPages[scope];
      if (!page) throw new Error('会话分类无效');
      if (page.request) {
        const waitingForHead = options.more && !page.requestMore;
        await page.request;
        if (waitingForHead) return loadThreadPage(scope, options);
        return;
      }
      if (!options.more && options.useCache && !options.force && page.loaded && Date.now() - page.at < 30000) return;
      if (options.more && page.loaded && !page.nextCursor) return;
      const more = Boolean(options.more && page.loaded);
      if (more || options.force || !page.errorMore) {
        page.error = '';
        page.errorMore = false;
      }
      const request = (async () => {
        const params = new URLSearchParams({ limit: String(THREAD_PAGE_SIZE), scope, token });
        if (options.force) params.set('refresh', '1');
        if (more) params.set('cursor', page.nextCursor);
        let response = await fetchApi(`/codex/threads?${params}`, { cache: 'no-store' });
        let data = await response.json();
        const restartCursor = more && !response.ok && (response.status === 400 || response.status === 410);
        if (restartCursor) {
          params.delete('cursor');
          response = await fetchApi(`/codex/threads?${params}`, { cache: 'no-store' });
          data = await response.json();
        }
        if (!response.ok || !data.ok) throw new Error(data.message || '读取线程失败');
        if (data.scope !== scope) throw new Error('列表服务正在更新，请稍后刷新');
        const previousIds = new Set(flattenKnownThreads().map(item => item.id));
        const overlaps = flattenKnownThreads(data.threads || []).some(item => previousIds.has(item.id));
        const completeHead = (!more || restartCursor) && !data.nextCursor;
        const retained = !completeHead && (more || page.moreLoaded) ? knownThreads
          : knownThreads.filter(item => Boolean(item.isProjectThread) !== (scope === 'projects'));
        const merged = new Map(retained.map(item => [item.id, item]));
        for (const item of data.threads || []) merged.set(item.id, item);
        knownThreads = [...merged.values()];
        if (completeHead) {
          delete page.resumeCursor;
          page.nextCursor = null;
          page.error = '';
          page.errorMore = false;
        } else if (restartCursor) {
          delete page.resumeCursor;
          page.nextCursor = data.nextCursor || null;
        } else if (more && page.resumeCursor !== undefined && (overlaps || !data.nextCursor)) {
          page.nextCursor = data.nextCursor ? page.resumeCursor : null;
          delete page.resumeCursor;
        } else if (more || !page.moreLoaded) {
          page.nextCursor = data.nextCursor || null;
        } else if (!overlaps && data.nextCursor) {
          // A reload may introduce more new rows than the first page holds.
          // Fill that gap before resuming the cached older-page continuation.
          if (page.resumeCursor === undefined) page.resumeCursor = page.nextCursor;
          page.nextCursor = data.nextCursor;
        }
        if (more) page.moreLoaded = true;
        page.loaded = true;
        page.at = Date.now();
      })();
      page.request = request;
      page.requestMore = more;
      renderThreadMenuIfVisualChanged();
      try { await request; }
      catch (error) {
        if (more || !page.errorMore) {
          page.error = error.message || '读取会话失败';
          page.errorMore = more;
        }
        throw error;
      }
      finally {
        if (page.request === request) page.request = null;
        renderThreadMenuIfVisualChanged();
      }
    }

    async function loadThreads(options = {}) {
      const scopes = options.scope ? [options.scope]
        : threadSearchQuery.trim() || threadMenuView === 'split' ? ['projects', 'conversations'] : [threadMenuView];
      const previousSelected = flattenKnownThreads().find(item => item.id === selectedThreadId);
      const results = await Promise.allSettled(scopes.map(scope => loadThreadPage(scope, options)));
      // A legacy unscoped selection is safe only after this device lists it.
      if (legacySelectedThreadId && results.every(result => result.status === 'fulfilled')) {
        if (!selectedThreadId && flattenKnownThreads().some(item => item.id === legacySelectedThreadId)) selectedThreadId = legacySelectedThreadId;
        legacySelectedThreadId = '';
        localStorage.removeItem('codexMini.selectedThread');
        if (selectedThreadId) localStorage.setItem(SELECTED_THREAD_STORAGE_KEY, selectedThreadId);
      }
      if (previousSelected?.id === selectedThreadId && !flattenKnownThreads().some(item => item.id === selectedThreadId)) {
        knownThreads.push(previousSelected);
      }
      if (options.preserveSelectedMissing === true && selectedThreadId && !flattenKnownThreads().some(item => item.id === selectedThreadId)) {
        knownThreads = [selectedThreadPlaceholder(selectedThreadId), ...knownThreads];
      }
      for (const item of flattenKnownThreads()) {
        applyThreadRuntimeState(item.id, runtimeSnapshotFromThread(item), { detectTransitions: Boolean(options.detectTransitions) });
      }
      pruneCompletedThreadNotices();
      if (!pendingNewThread && !selectedThreadId) {
        selectedThreadId = sortThreadsByTime(knownThreads)[0]?.id || '';
        if (selectedThreadId) localStorage.setItem(SELECTED_THREAD_STORAGE_KEY, selectedThreadId);
      }
      setThreadCompleteNotice(selectedThreadId, false);
      updateThreadTitle();
      persistThreadBrowserCache();
      if (options.renderMenu === 'ifChanged') renderThreadMenuIfVisualChanged();
      else renderThreadMenu();
      const failed = results.find(result => result.status === 'rejected');
      if (failed) throw failed.reason;
    }

    async function openCodexThread(threadId, apiOptions = {}) {

        apiTimeoutMs: 15000,

      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.message || '切换 Codex 线程失败');
      return data;
    }

    function closeThreadActionCard() {
      threadActionCard.classList.remove('is-open', 'is-renaming');
      threadActionCard.style.left = '';
      threadActionCard.style.top = '';
      threadRenameInput.blur();
    }

    function cancelThreadRename() {
      suppressThreadClick = true;
      closeThreadActionCard();
    }

    function viewportHeight() {
      return Math.round((window.visualViewport && window.visualViewport.height) || window.innerHeight || document.documentElement.clientHeight || 0);
    }

    function positionThreadActionCard(anchorElement) {
      if (!anchorElement || typeof anchorElement.getBoundingClientRect !== 'function') return;
      const anchor = anchorElement.getBoundingClientRect();
      const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      const margin = 10;
      const cardWidth = threadActionCard.offsetWidth || 224;
      const cardHeight = threadActionCard.offsetHeight || 160;
      const anchorCenterX = anchor.left + anchor.width / 2;
      const left = Math.max(margin, Math.min(viewportWidth - cardWidth - margin, anchorCenterX - cardWidth / 2));
      const belowTop = anchor.bottom + 6;
      const aboveTop = anchor.top - cardHeight - 6;
      const hasRoomBelow = belowTop + cardHeight + margin <= viewportHeight;
      const top = hasRoomBelow ? belowTop : Math.max(margin, aboveTop);
      threadActionCard.style.left = `${Math.round(left)}px`;
      threadActionCard.style.top = `${Math.round(top)}px`;
    }

    function vibrateForLongPress() {
      let fired = false;
      try {
        window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('medium');
        fired = true;
      } catch {}
      try {
        window.webkit?.messageHandlers?.haptic?.postMessage?.('medium');
        fired = true;
      } catch {}
      try {
        window.webkit?.messageHandlers?.hapticFeedback?.postMessage?.({ type: 'impact', style: 'medium' });
        fired = true;
      } catch {}
      try {
        window.webkit?.messageHandlers?.vibrate?.postMessage?.([45, 25, 45]);
        fired = true;
      } catch {}
      try {
        if (navigator.vibrate) {
          navigator.vibrate([45, 25, 45]);
          fired = true;
        }
      } catch {}
      return fired;
    }

    function openThreadActionCard(threadId = selectedThreadId, options = {}) {

      threadActionCard.style.top = '';

      threadActionPinToggle.setAttribute('aria-label', current.pinned ? '取消置顶当前线程' : '置顶当前线程');
      threadQuestionRestore.hidden = closedDesktopQuestions(threadId).size === 0;
      threadActionCard.classList.add('is-open');

    function showRenamePanel() {

      threadActionCard.classList.add('is-renaming');
      threadActionCard.style.left = '';

    async function postThreadAction(action, payload = {}) {
      const targetThreadId = actionThreadId || selectedThreadId;
      if (!targetThreadId) throw new Error('还没有选中线程。');
      const response = await fetchApi('/codex/thread-action', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-mobile-typer-token': token },
        body: JSON.stringify({ action, threadId: targetThreadId, ...payload }),
        apiTimeoutMs: 20000,
        routeSwitchQuiet: true,
        retryProbeTimeoutMs: 900,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.message || '线程操作失败');
      return data;
    }

    async function archiveCurrentThread() {
      const archivedThreadId = actionThreadId || selectedThreadId;
      if (!archivedThreadId) return;
      const archivedSelectedThread = archivedThreadId === selectedThreadId;
      closeThreadActionCard();
      setWorkingDot(true);
      setNotice('正在归档当前 Codex 线程…', 'ok');
      try {
        const data = await postThreadAction('archive');
        completedThreadIds.delete(archivedThreadId);
        knownThreads = knownThreads.filter(item => item.id !== archivedThreadId);
        if (archivedSelectedThread) {
          serializeMessages();
          stopPolling();
          selectedThreadId = '';
          syncedThreadId = '';
          localStorage.removeItem(SELECTED_THREAD_STORAGE_KEY);
          await loadThreads();
          const nextThreadId = data.nextThreadId || selectedThreadId || '';
          if (nextThreadId) {
            selectedThreadId = '';
            await selectThread(nextThreadId);
          } else {
            clearThreadMessages();
            updateThreadTitle();
            renderThreadMenu();
          }
        } else {
          renderThreadMenu();
          await loadThreads({ renderMenu: 'always' });
        }
        setNotice('已归档当前线程', 'ok');
      } catch (error) {
        setNotice(error.message || '归档失败', 'error');
      } finally {
        if (!activeAssistant && !pollTimer) setWorkingDot(false);
      }
    }

    async function toggleCurrentThreadPin() {
      const current = actionThreadItem();
      if (!current) return;
      const targetThreadId = current.id;
      const nextPinned = !current.pinned;
      closeThreadActionCard();
      setWorkingDot(true);
      setNotice(nextPinned ? '正在置顶当前 Codex 线程…' : '正在取消置顶当前 Codex 线程…', 'ok');
      try {
        await postThreadAction(nextPinned ? 'pin' : 'unpin');
        for (const item of flattenKnownThreads()) {
          if (item.id === targetThreadId) item.pinned = nextPinned;
        }
        if (targetThreadId === selectedThreadId) updateThreadTitle();
        renderThreadMenu();
        await loadThreads({ renderMenu: 'always' });
        setNotice(nextPinned ? '已同步置顶：Codex 和手机列表都会置顶' : '已同步取消置顶', 'ok');
      } catch (error) {
        setNotice(error.message || '置顶操作失败', 'error');
      } finally {
        if (!activeAssistant && !pollTimer) setWorkingDot(false);
      }
    }

    async function renameCurrentThread() {
      const current = actionThreadItem();
      if (!current) return;
      const targetThreadId = current.id;
      const nextName = threadRenameInput.value.replace(/\s+/g, ' ').trim();
      if (!nextName) {
        setNotice('新名称不能为空', 'error');

        closeThreadActionCard();
        return;

      threadRenameSave.disabled = true;
      setWorkingDot(true);
      setNotice('正在重命名当前 Codex 线程…', 'ok');

        const data = await postThreadAction('rename', { name: nextName });
        for (const item of flattenKnownThreads()) {
          if (item.id === targetThreadId) item.name = data.name || nextName;
        }
        if (targetThreadId === selectedThreadId) updateThreadTitle();
        renderThreadMenu();
        window.setTimeout(() => loadThreads({ renderMenu: 'always' }).catch(() => {}), 700);
        setNotice('已重命名当前线程', 'ok');
      } catch (error) {
        setNotice(error.message || '重命名失败', 'error');

        threadRenameSave.disabled = false;
