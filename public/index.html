    async function createNewThreadInCurrentProject(options = {}) {
      if (sendRequestBusy || releaseSessionButton.disabled) return;
      const project = options.forceConversation ? null : options.project;
      if (!options.forceConversation && !project?.path) return;
      serializeMessages();
      pendingNewThread = { previousThreadId: selectedThreadId || '', projectPath: project?.path || '', projectName: project?.name || '对话' };
      followLatest = true;
      historyRefreshPending = false;
      updateJumpToLatest();
      historyRequestId += 1;
      historyDisplayThreadId = '';
      historyDisplayLimit = HISTORY_PAGE_SIZE;
      historyNextCursor = null;
      historyUsesCursor = false;
      historyMessageIds = new Set();
      historyMoreButton.hidden = true;
      detachForegroundRunForNewThread();
      selectedThreadId = '';
      syncedThreadId = '';
      localStorage.removeItem(SELECTED_THREAD_STORAGE_KEY);
      clearThreadMessages();
      resetApproval();
      updateThreadTitle();
      renderThreadMenu();
      setThreadMenuOpen(false);
      setNotice(project ? `新对话将创建在 ${project.name}，发送首条消息后开始` : '新建无项目对话，发送首条消息后开始', 'ok');
      textarea.focus({ preventScroll: true });

    async function syncCodexThread(threadId = selectedThreadId, options = {}) {
      if (!threadId) return { ok: false, skipped: true };
      if (apiBackend === 'app-server') {
        syncedThreadId = threadId;
        return { ok: true, threadId, mode: 'app-server' };
      }
      const { quiet = false, force = false } = options;
      if (!force && syncedThreadId === threadId) return { ok: true, threadId, cached: true };

      const requestId = ++syncRequestId;
      const previousStatus = topStatusState || '已连接';
      setWorkingDot(true);
      setTopStatus('同步线程');
      if (!quiet) setNotice('正在同步桌面端 Codex 到当前线程…', 'ok');
      try {
        const data = await openCodexThread(threadId, { routeSwitchQuiet: quiet, retryProbeTimeoutMs: 900 });
        if (requestId === syncRequestId && threadId === selectedThreadId) syncedThreadId = threadId;
        if (!quiet && requestId === syncRequestId) setNotice('桌面端 Codex 已切到当前线程', 'ok');
        return data || { ok: true, threadId };
      } catch (error) {
        if (requestId === syncRequestId) setNotice(error.message || '同步 Codex 线程失败', 'error');
        throw error;
      } finally {
        if (requestId === syncRequestId) {
          setTopStatus(previousStatus === '同步线程' ? '已连接' : previousStatus);
          if (!pollTimer && !activeAssistant) setWorkingDot(false);
        }
      }
    }

    function isRunningStatus(data) {
      return Boolean(data && (data.active || data.status === 'running' || data.status === 'waiting'));
    }

    function codexStatusSignature(data) {
      if (!data || !data.available) return '';
      return [
        data.threadId || '',
        data.sessionFile || '',
        data.turnId || '',
        data.status || '',
        data.progressVersion || '',
        data.updatedAt || '',
        data.startedAt || '',
        data.completedAt || '',
      ].join('|');
    }

    function runtimeSnapshotFromStatusData(data) {
      if (!data || !data.available) return null;
      return {
        status: data.status || '',
        active: Boolean(data.active || isThreadRunningStatus(data.status)),
        startedAt: data.startedAt || '',
        completedAt: data.completedAt || '',
        updatedAt: data.updatedAt || data.completedAt || data.startedAt || '',
        turnId: data.turnId || '',
      };
    }

    async function resumeActiveThreadStatus(threadId, requestId = historyRequestId, snapshot = null, goalReadEpoch = goalEpoch, approvalRead = 0) {
      if (!threadId) return false;
      let data = snapshot;
      if (!data) {
        const params = new URLSearchParams({ token, thread: threadId });
        const response = await fetchApi(`/codex/status?${params}`, { cache: 'no-store' });
        data = await response.json();
        approvalRead = approvalResponseSequences.get(response);
        if (!response.ok) return false;
      }
      if (requestId !== historyRequestId || threadId !== selectedThreadId) return false;
      if (!data.ok || !data.available) return false;
      if (Array.isArray(data.queue)) {
        queuedSends = data.queue.map(item => ({ ...item, summary: queuedInputSummary(item.input), state: 'queued', localOnly: false }));
        queuePaused = Boolean(data.queuePaused);
        queueWaitingForWriter = Boolean(data.waitingForWriter);
        threadQueueCounts.set(threadId, queuedSends.length);
        renderQueuedSends();
      }
      applyApprovalSnapshot(data, approvalRead, threadId);
      updateContextFromStatus(data, goalReadEpoch);
      applyThreadRuntimeState(threadId, runtimeSnapshotFromStatusData(data), { detectTransitions: false });
      renderThreadMenuIfVisualChanged();
      lastStatusSignature = codexStatusSignature(data);
      if (isRunningStatus(data) && isLocalStopSuppressed(threadId, data.startedAt)) return false;
      if (!isRunningStatus(data)) return false;

      const durationText = formatDuration(data.durationMs || 0);
      const resumeCommandKind = latestUserCommandKind();
      const resumeCommandUi = commandUi(resumeCommandKind);
      activeAssistant = messageEl('assistant', resumeCommandUi?.pendingText || 'Codex 正在回复…', { label: resumeCommandUi ? resumeCommandUi.runningLabel(durationText) : `Codex · 运行 ${durationText}`, pending: true });
      activeAssistant.commandKind = resumeCommandKind;
      activeAssistant.observing = Boolean(data.observing);
      setActiveRunStart(data.startedAt || '', Date.now() - (Number(data.durationMs) || 0));
      activeAssistant.runDurationText = durationText;
      updateComposerAction();
      renderProcessSteps(activeAssistant.bubble, runningProgressSteps(data, resumeCommandUi?.pendingText));
      setTopStatus(resumeCommandUi ? resumeCommandUi.runningNotice(durationText) : `Codex 正在回复 · ${durationText}`);
      setNotice(data.observing ? '已接上任务进度，将持续更新' : '已接上这个线程正在进行的回复状态', 'ok');
      startPolling({
        since: data.startedAt || '',
        threadId,
        sessionFile: data.sessionFile || '',
      });
      return true;
    }

    async function loadThreadHistory(threadId = selectedThreadId, options = {}) {
      if (!threadId) return;
      if (historyLoadPromise && historyLoadingThreadId === threadId) return historyLoadPromise;
      historyLoadingThreadId = threadId;
      const request = readThreadHistoryPage(threadId, options);
      historyLoadPromise = request;
      try { await request; }
      finally { if (historyLoadPromise === request) historyLoadPromise = null; }
    }

    async function readThreadHistoryPage(threadId, options = {}) {
      if (!threadId) return;
      resetGoalForThread();
      const goalReadEpoch = goalEpoch;
      const paged = apiBackend === 'app-server';
      const more = Boolean(options.more && historyDisplayThreadId === threadId);
      const cursorPage = paged && (!more || historyUsesCursor);
      if (cursorPage && more && !historyNextCursor) return;
      const requestId = ++historyRequestId;
      let previousHeight;
      let previousTop;
      let anchor = null;
      let anchorTop;
      let inserted = false;
      const limit = cursorPage ? HISTORY_PAGE_SIZE : Math.min(240, (historyDisplayThreadId === threadId ? historyDisplayLimit : HISTORY_PAGE_SIZE) + (more ? HISTORY_PAGE_SIZE : 0));
      historyMoreButton.disabled = true;
      const loading = !thread.querySelector('.message') ? messageEl('assistant', '正在加载聊天记录…', { label: 'Codex Relay' }) : null;
      try {
        const params = new URLSearchParams({ token, thread: threadId, limit: String(limit) });
        if (cursorPage && more) params.set('cursor', historyNextCursor);
        const endpoint = paged && !more ? 'thread-bootstrap' : 'history';
        const response = await fetchApi(`/codex/${endpoint}?${params}`, { cache: 'no-store', apiTimeoutMs: 30000 });
        const payload = await response.json();
        if (requestId !== historyRequestId || threadId !== selectedThreadId) return;
        if (payload.code === 'HISTORY_CURSOR_EXPIRED' && more) {
          await readThreadHistoryPage(threadId);
          setNotice('较早记录的分页已过期，已重新加载最近 5 条', 'ok');
          return;
        }
        const data = endpoint === 'thread-bootstrap' ? payload.history : payload;
        if (!response.ok || !payload.ok || !data) throw new Error(payload.message || '读取聊天记录失败');
        if (!response.ok || !data.ok) throw new Error(data.message || '读取聊天记录失败');
        if (options.background && !followLatest) {
          historyRefreshPending = true;
          updateJumpToLatest();
          setNotice('有新消息，点击下箭头查看', 'ok');
          return;
        }
        if (!more) historyRefreshPending = false;
        if (more) {
          thread.classList.add('is-instant-scroll');
          previousHeight = thread.scrollHeight;
          previousTop = thread.scrollTop;
          anchor = cursorPage ? thread.querySelector('.message') : null;
          anchorTop = anchor?.getBoundingClientRect().top;
          inserted = true;
        }
        if (!more || !cursorPage) {
          clearThreadMessages();
          historyMessageIds = new Set();
        }
        historyDisplayThreadId = threadId;
        historyDisplayLimit = limit;
        historyNextCursor = data.nextCursor || null;
        historyUsesCursor = paged && Object.prototype.hasOwnProperty.call(data, 'nextCursor');
        historyMoreButton.hidden = historyUsesCursor ? !historyNextCursor : !data.truncated || limit >= 240;
        if (!data.available || !Array.isArray(data.messages) || !data.messages.length) {
          if (!more) {
            const resumed = await resumeActiveThreadStatus(threadId, requestId, payload.status, goalReadEpoch, approvalResponseSequences.get(response));
            if (!resumed) messageEl('assistant', '这个线程暂时没有可加载的聊天记录。', { label: 'Codex Relay' });
          }
          return;
        }
        if (!more) beginHistoryRenderAtBottom();
        try {
          for (const row of data.messages) {
            if (row.id && historyMessageIds.has(row.id)) continue;
            const msg = messageEl(row.role, row.text || '', {
              label: row.label || (row.role === 'user' ? '你' : 'Codex'),
              questionReplies: row.questionReplies,
              skipScroll: true,
              before: anchor,
            });
            if (row.id) historyMessageIds.add(row.id);
            if (row.attachments?.length) appendImagesToBubble(msg, row.attachments);
          }
        } finally {
          if (!more) finishHistoryRenderAtBottom();
        }
        const resumed = more ? false : await resumeActiveThreadStatus(threadId, requestId, payload.status, goalReadEpoch, approvalResponseSequences.get(response));
        if (payload.status?.ok === false) {
          setNotice(payload.status.message || '聊天记录已加载，回复状态暂时不可用', 'error');
        } else if (!resumed) {
          if (data.truncated) setNotice(`已加载最近 ${data.messages.length} 条消息`, 'ok');
          else setNotice('已从 Codex App Server 加载聊天记录', 'ok');
        }
      } catch (error) {
        if (requestId !== historyRequestId || threadId !== selectedThreadId) return;
        loading?.article.remove();
        setNotice(error.message || '读取聊天记录失败', 'error');
        if (!thread.querySelector('.message')) restoreMessages();
      } finally {
        loading?.article.remove();
        if (requestId === historyRequestId && threadId === selectedThreadId) {
          historyMoreButton.disabled = false;
          if (inserted) {
            thread.scrollTop += anchor?.isConnected
              ? anchor.getBoundingClientRect().top - anchorTop
              : previousTop + thread.scrollHeight - previousHeight - thread.scrollTop;
            requestAnimationFrame(() => thread.classList.remove('is-instant-scroll'));
          }
        }
      }
    }

    async function loadThreadView(threadId) {
      if (apiBackend === 'app-server') return loadThreadHistory(threadId);
      return Promise.all([loadThreadHistory(threadId), loadQueue(threadId), loadApprovals(threadId)]);
    }

    async function selectThread(threadId) {
      if (!threadId) return;
      pendingNewThread = null;
      selectedProjectKey = threadItemById(threadId)?.isProjectThread ? threadItemById(threadId).projectKey : '';
      setThreadMenuOpen(false);
      setThreadCompleteNotice(threadId, false);
      if (threadId === selectedThreadId) {
        if (activeAssistant || pollTimer) {
          setNotice('当前正在查看这个线程，回复状态会继续更新', 'ok');
          return;
        }
        setNotice('正在刷新这个线程的聊天记录…', 'ok');
        await loadThreadView(threadId);
        return;
      }

      serializeMessages();
      stopPolling();
      selectedThreadId = threadId;
      followLatest = true;
      historyRefreshPending = false;
      updateJumpToLatest();
      syncedThreadId = '';
      localStorage.setItem(SELECTED_THREAD_STORAGE_KEY, selectedThreadId);
      setThreadCompleteNotice(selectedThreadId, false);
      activeAssistant = null;
      clearQueuedSends();
      resetApproval();
      renderReasoningBadge(bestReasoningMode(null, selectedThreadId));
      renderModelBadge(bestModelInfo(null, selectedThreadId));
      updateComposerAction();
      lastStatusSignature = '';
      clearThreadMessages();
      updateThreadTitle();
      renderThreadMenu();
      setNotice('已切换对话，正在加载聊天记录…', 'ok');

      await loadThreadView(threadId);
    }

    function safeBubbleHtml(article) {
      const bubble = article.querySelector('.bubble');
      if (!bubble) return '';
      const clone = bubble.cloneNode(true);
      for (const img of [...clone.querySelectorAll('img.attachment-preview')]) {
        if (img.dataset.previewId) { img.removeAttribute('src'); continue; }
        const note = document.createElement('div');
        note.className = 'attachment-note';
        note.textContent = `图片：${img.alt || '已发送图片'}（刷新后不缓存预览）`;
        img.replaceWith(note);
      }
      const attachments = article.querySelector('.message-attachments');
      if (attachments) {
        for (const img of [...attachments.querySelectorAll('img.attachment-preview')]) {
          if (img.dataset.previewId) { const saved = img.cloneNode(true); saved.removeAttribute('src'); clone.appendChild(saved); continue; }
          const note = document.createElement('div');
          note.className = 'attachment-note';
          note.textContent = `图片：${img.alt || '已发送图片'}（刷新后不缓存预览）`;
          clone.appendChild(note);
        }
        for (const note of [...attachments.querySelectorAll('.attachment-note')]) {
          clone.appendChild(note.cloneNode(true));
        }
      }
      const html = clone.innerHTML || '';
      return html.length > 30000 ? `${html.slice(0, 30000)}…` : html;
    }

    function serializeMessages() {
      const rows = [...thread.querySelectorAll('.message')].slice(-30).map(article => ({
        role: article.classList.contains('user') ? 'user' : 'assistant',
        label: article.querySelector('.meta')?.textContent?.replace(/ · 正在回复$/, '') || '',
        html: safeBubbleHtml(article),
      }));
      const key = chatStorageKey();
      try {
        localStorage.setItem(key, JSON.stringify(rows));
      } catch (error) {
        console.warn('Codex Relay chat cache skipped:', error);
        try {
          localStorage.removeItem(key);
          localStorage.setItem(key, JSON.stringify(rows.slice(-8)));
        } catch {
          localStorage.removeItem(key);
        }
      }
    }
    function restoreMessages() {
      try {
        const rows = JSON.parse(localStorage.getItem(chatStorageKey()) || '[]');
        for (const row of rows.slice(-20)) {
          const msg = messageEl(row.role, '', { label: row.label });
          msg.bubble.innerHTML = row.html;
          for (const img of msg.bubble.querySelectorAll('img[data-preview-id]')) preparePreviewImage(img);
        }
      } catch {}
    }

    function stopPolling() {
      pollGeneration += 1;
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      stopRunDurationTimer();
      activeWatch = null;
      updateComposerAction();
      setWorkingDot(false);
      setTopStatus('已连接');
    }

    function detachForegroundRunForNewThread() {
      pollGeneration += 1;
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      stopRunDurationTimer();
      activeWatch = null;
      activeAssistant = null;
      lastPreview = '';
      updateComposerAction();
      setTopStatus('已连接');
    }

    function adoptNewThreadId(threadId) {
      if (!threadId || (selectedThreadId && selectedThreadId === threadId)) return;
      selectedThreadId = threadId;
      pendingNewThread = null;
      syncedThreadId = threadId;
      if (activeWatch) activeWatch.threadId = threadId;
      localStorage.setItem(SELECTED_THREAD_STORAGE_KEY, threadId);
      setThreadCompleteNotice(threadId, false);
      renderReasoningBadge(bestReasoningMode(null, threadId));
      renderModelBadge(bestModelInfo(null, threadId));
      updateThreadTitle();
      loadThreads({ detectTransitions: false, renderMenu: 'ifChanged', preserveSelectedMissing: true }).catch(error => {
        console.warn('Codex Relay new thread list refresh skipped:', error);
      });
    }

    async function pollStatus(watch, generation = pollGeneration) {
      const goalReadEpoch = goalEpoch;
      if (generation !== pollGeneration) return;
      if (pollStatusBusy || document.hidden || Date.now() < apiPauseUntil) return;
      if (!watch || !activeAssistant) return stopPolling();
      pollStatusBusy = true;
      const params = new URLSearchParams({ token, since: watch.since || '', thread: watch.threadId || selectedThreadId || '' });
      if (watch.sessionFile) params.set('session', watch.sessionFile);
      if (watch.expectNewThread) params.set('expectNewThread', '1');
      if (watch.excludeThreadId) params.set('excludeThread', watch.excludeThreadId);
      if (watch.cwd) params.set('cwd', watch.cwd);
      if (watch.backgroundRunId) params.set('backgroundRunId', watch.backgroundRunId);
      try {
        const res = await fetchApi(`/codex/status?${params}`, { cache: 'no-store' });
        const data = await res.json();
        if (generation !== pollGeneration || !activeAssistant) return;
        if (!data.ok) throw new Error(data.message || '读取失败');
        if (!data.available && data.status === 'missing') throw new Error(data.message || '没有找到所选线程。');
        if (data.available) {
          if (data.threadId && (!selectedThreadId || pendingNewThread)) adoptNewThreadId(data.threadId);
          updateContextFromStatus(data, goalReadEpoch);
          if (Array.isArray(data.queue)) {
            queuedSends = data.queue.map(item => ({ ...item, summary: queuedInputSummary(item.input), state: 'queued', localOnly: false }));
            queuePaused = Boolean(data.queuePaused);
            queueWaitingForWriter = Boolean(data.waitingForWriter);
            threadQueueCounts.set(data.threadId || selectedThreadId, queuedSends.length);
            renderQueuedSends();
          }
          applyApprovalSnapshot(data, approvalResponseSequences.get(res), data.threadId || watch.threadId);
          if (data.uncertainOperations?.length) setNotice('有一项消息操作仍待确认，请检查聊天记录后再决定是否重试。', 'error');
          applyThreadRuntimeState(data.threadId || watch.threadId || selectedThreadId, runtimeSnapshotFromStatusData(data), { detectTransitions: true });
          renderThreadMenuIfVisualChanged();
          lastStatusSignature = codexStatusSignature(data);
        }
        setActiveRunStart(data.startedAt || watch.since || '', Date.now() - (Number(data.durationMs) || 0));
        activeAssistant.observing = Boolean(data.observing);
        updateActiveRunDuration(true);
        const activeCommandUi = commandUi(activeAssistant.commandKind || '');
        if (data.status === 'complete' || data.status === 'error' || data.status === 'interrupted') {
          const isErrorStatus = data.status === 'error';
          const finalText = isErrorStatus
            ? (data.error || data.preview || 'Codex 回复失败。')
            : data.status === 'interrupted'
              ? (data.error || data.preview || '已取消当前 Codex 回复。')
            : (activeCommandUi?.completeText || data.final || data.preview || '已完成。');
          if (finalText !== lastPreview) {
            lastPreview = finalText;
            setMarkdown(activeAssistant.bubble, finalText);
            scrollBottom();
          }
          const finalDurationText = formatDuration(finalRunDurationMs(data));
          activeAssistant.runDurationText = finalDurationText;
          setMetaLabel(activeAssistant.meta, isErrorStatus
            ? `Codex · 失败 ${finalDurationText}`
            : activeCommandUi ? activeCommandUi.completeLabel(finalDurationText) : `Codex · 已处理 ${finalDurationText}`);
          activeAssistant.article.classList.remove('pending');
          addDetails(activeAssistant, data.steps || []);
          serializeMessages();
          promoteNextQueuedSendAfterCurrent(data);
          if (isErrorStatus || data.status === 'interrupted') {
            queuePaused = queuedSends.length > 0;
            renderQueuedSends();
          }
          activeAssistant = null;
          stopPolling();
        } else {
          const steps = runningProgressSteps(data, activeCommandUi?.pendingText);
          const processSignature = JSON.stringify(steps);
          if (processSignature !== lastPreview) {
            lastPreview = processSignature;
            renderProcessSteps(activeAssistant.bubble, steps);
            scrollBottom();
          }
          if (!data.active) setTopStatus(data.observing ? '正在同步进度' : '等待 Codex');
        }
      } catch (error) {
        if (generation === pollGeneration) setNotice(error.message || '读取 Codex 回复失败', 'error');
      } finally {
        pollStatusBusy = false;
      }
    }

    function startPolling(watch) {
      stopPolling();
      if (!activeAssistant) return;
      const generation = ++pollGeneration;
      activeWatch = watch || null;
      setWorkingDot(true);
      lastPreview = '';
      setActiveRunStart(watch?.since || '', Date.now());
      setTopStatus(commandUi(activeAssistant.commandKind || '') ? '正在压缩' : '等待 Codex');
      updateActiveRunDuration(true);
      startRunDurationTimer();
      pollStatus(watch, generation);
      if (activeAssistant && generation === pollGeneration) {
        pollTimer = setInterval(() => pollStatus(watch, generation), 3000);
        updateComposerAction();
      }
    }

    async function refreshCurrentThreadIfChanged() {
      const goalReadEpoch = goalEpoch;
      const readId = historyRequestId;
      if (!clientReady || !selectedThreadId || activeAssistant || autoRefreshBusy || historyLoadPromise || document.hidden || Date.now() < apiPauseUntil) return;
      autoRefreshBusy = true;
      let dotStarted = false;
      const threadId = selectedThreadId;
      try {
        const params = new URLSearchParams({ token, thread: threadId });
        const response = await fetchApi(`/codex/status?${params}`, { cache: 'no-store' });
        const data = await response.json();
        if (threadId !== selectedThreadId || readId !== historyRequestId || activeAssistant || !response.ok || !data.ok || !data.available) return;
        updateContextFromStatus(data, goalReadEpoch);
        if (Array.isArray(data.queue)) {
          queuedSends = data.queue.map(item => ({ ...item, summary: queuedInputSummary(item.input), state: 'queued', localOnly: false }));
          queuePaused = Boolean(data.queuePaused);
          queueWaitingForWriter = Boolean(data.waitingForWriter);
          threadQueueCounts.set(threadId, queuedSends.length);
          renderQueuedSends();
        }
        applyApprovalSnapshot(data, approvalResponseSequences.get(response), threadId);
        if (data.uncertainOperations?.length) setNotice('有一项消息操作仍待确认，请检查聊天记录后再决定是否重试。', 'error');
        applyThreadRuntimeState(threadId, runtimeSnapshotFromStatusData(data), { detectTransitions: false });
        renderThreadMenuIfVisualChanged();
        if (isRunningStatus(data) && isLocalStopSuppressed(threadId, data.startedAt)) {
          lastStatusSignature = codexStatusSignature(data);
          return;
        }
        const signature = codexStatusSignature(data);
        const shouldReload = historyRefreshPending || isRunningStatus(data) || (lastStatusSignature && signature && signature !== lastStatusSignature);
        if (!lastStatusSignature) lastStatusSignature = signature;
        if (!shouldReload) return;
        lastStatusSignature = signature;
        if (!followLatest) { historyRefreshPending = true; updateJumpToLatest(); return; }
        setWorkingDot(true);
        dotStarted = true;
        setNotice(isRunningStatus(data) ? 'Codex 正在回复，正在同步…' : '检测到聊天记录更新，正在同步…', 'ok');
        await loadThreadHistory(threadId, { background: true });
      } catch (error) {
        console.warn('Codex Relay auto refresh skipped:', error);
      } finally {
        autoRefreshBusy = false;
        if (dotStarted && !activeAssistant && !pollTimer) setWorkingDot(false);
      }
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      refreshCodexQuota();
      autoRefreshTimer = setInterval(() => { renderCodexQuota(); refreshCurrentThreadIfChanged(); refreshCodexQuota(); }, 5000);
    }

    async function refreshThreadRuntimeStates(options = {}) {
      if (!clientReady || threadStateBusy || document.hidden || Date.now() < apiPauseUntil) return;
      threadStateBusy = true;
      try {
        await refreshRelayStatus({ quiet: true, apiTimeoutMs: 3500 }).catch(() => null);
        await loadThreads({ detectTransitions: options.detectTransitions !== false, renderMenu: 'ifChanged' });
      } catch (error) {
        console.warn('Codex Relay thread state refresh skipped:', error);
      } finally {
        threadStateBusy = false;
      }
    }

    function scheduleForegroundStateRefresh() {
      if (!clientReady || document.hidden || Date.now() < apiPauseUntil) return;
      pruneCompletedThreadNotices();
      if (appResumeRefreshTimer) window.clearTimeout(appResumeRefreshTimer);
      appResumeRefreshTimer = window.setTimeout(() => {
        appResumeRefreshTimer = null;
        checkClientVersion();
        refreshCodexQuota(true);
        refreshApiConfigIfNeeded();
        if (activeAssistant && activeWatch) pollStatus(activeWatch);
        else refreshCurrentThreadIfChanged();
        refreshThreadRuntimeStates({ detectTransitions: true });
      }, 80);
    }

    function closeReasoningMenu() {
      reasoningMenuCard.classList.remove('is-open');
      reasoningMenuCard.style.left = '';
      reasoningMenuCard.style.top = '';
    }

    function positionReasoningMenu(anchorElement = reasoningBadge) {
      if (!anchorElement || typeof anchorElement.getBoundingClientRect !== 'function') return;
      const anchor = anchorElement.getBoundingClientRect();
      const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      const margin = 10;
      const cardWidth = reasoningMenuCard.offsetWidth || 97;
      const cardHeight = reasoningMenuCard.offsetHeight || 90;
      const rightAlignedLeft = anchor.right - cardWidth;
      const left = Math.max(margin, Math.min(viewportWidth - cardWidth - margin, rightAlignedLeft));
      const belowTop = anchor.bottom + 7;
      const aboveTop = anchor.top - cardHeight - 7;
      const top = belowTop + cardHeight + margin <= viewportHeight ? belowTop : Math.max(margin, aboveTop);
      reasoningMenuCard.style.left = `${Math.round(left)}px`;
      reasoningMenuCard.style.top = `${Math.round(top)}px`;
    }

    function openReasoningMenu(options = {}) {
      if (useCombinedModelMenu()) {
        openModelMenu(options);
        return;
      }
      setThreadMenuOpen(false);
      closeThreadActionCard();
      closeContextQuickCard();
      if (typeof closePermissionMenu === 'function') closePermissionMenu();
      closeModelMenu();
      renderReasoningMenu();
      reasoningMenuCard.classList.add('is-open');
      positionReasoningMenu(reasoningBadge);
      if (options.vibrate) vibrateForLongPress();

    function startSendProgressPolling(clientRequestId, options = {}) {
      if (!clientRequestId) return () => {};
      let stopped = false;
      let busy = false;
      let lastPhase = '';
      let lastMessage = '';
      let timer = null;
      const poll = async () => {
        if (stopped || busy || document.hidden) return;
        busy = true;
        try {
          const params = new URLSearchParams({ id: clientRequestId, token });
          const response = await fetchApi(`/codex/send-status?${params}`, {
            cache: 'no-store',
            headers: { 'x-mobile-typer-token': token },
            apiTimeoutMs: 5000,
            routeSwitchQuiet: true,
            retryProbeTimeoutMs: 700,
          });
          const data = await response.json().catch(() => ({}));
          if (stopped) return;
          const progress = data && data.ok && data.found ? data.progress : null;
          const phase = String(progress?.phase || '');
          const message = String(progress?.message || '');
          if (message && (phase !== lastPhase || message !== lastMessage)) {
            lastPhase = phase;
            lastMessage = message;
            setNotice(message, options.type || 'ok');
            if (options.updateBubble !== false && activeAssistant && activeAssistant.article?.classList.contains('pending')) {
              setMarkdown(activeAssistant.bubble, message);
            }
          }
          if (data.done) {
            stopped = true;
            if (timer) clearInterval(timer);
          }
        } catch {
          // Send progress is best-effort; the main /send request still owns
          // success and failure reporting.
        } finally { busy = false; }
      };
      poll();
      timer = setInterval(poll, 1000);
      return () => {
        stopped = true;
        if (timer) clearInterval(timer);
      };
    }

    window.addEventListener('pageshow', scheduleForegroundStateRefresh);
    window.addEventListener('storage', event => {
      if (event.key === `codexMini.relayDevice.v1:${currentApiBase}` && event.newValue && event.newValue !== activeDeviceId) {
        reloadForDeviceChange(); return;
      }
      const prefix = `codexMini.closedQuestions.v1:${deviceStorageScope || currentApiBase}:`;
      if (event.key !== null && !event.key.startsWith(prefix)) return;
      if (event.key === null) closedDesktopQuestionCache.clear();
      else closedDesktopQuestionCache.delete(event.key);
      renderDesktopQuestionHistory(desktopQuestionHistoryItems);
      threadQuestionRestore.hidden = closedDesktopQuestions(actionThreadId || selectedThreadId).size === 0;
    });
    window.addEventListener('focus', scheduleForegroundStateRefresh);

    lockViewportZoom();
    lockComposerDrag();
    lockPageScrollToThread();
    updateRouteBadge();
    renderReasoningBadge(bestReasoningMode(null, selectedThreadId));
    renderModelBadge(bestModelInfo(null, selectedThreadId));
    if (!window.codexMiniPairing) initializeThreadBrowserCache()
      .then(() => loadApiConfig())
      .then(() => chooseApiCandidate({ preferLocal: !publicRelayPage, quiet: true }))
      .then(() => loadThreads())
      .then(async () => {
        await refreshKeepAwakeStatus();
        await loadThreadView(selectedThreadId);
        clientReady = true;
        checkClientVersion();
        window.setInterval(checkClientVersion, 60000);
        scheduleThreadMenuFill();
        startAutoRefresh();
        startThreadStateWatcher();
        startRouteMonitor();
      })
      .catch(error => setNotice(error.message || '读取线程失败', 'error'));
    applyViewportSize();
    autosize();
    if (!window.matchMedia('(max-width: 700px), (pointer: coarse)').matches) {
      textarea.focus({ preventScroll: true });
    }
  </script>
</body>
</html>
