<!doctype html>
<html lang="zh-CN">

  <title>Codex Relay</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --topbar-bg: #000000;
      --topbar-row-height: 52px;
      --topbar-safe-lift: 0px;
      --top-control-size: 26px;
      --thread-composer-gap: 6px;
      --thread-menu-edge-gap: 12px;
      --status-pulse-ms: 1550ms;
      --notice-top-gap: 8px;
      --panel: #171717;
      --panel-2: #242424;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --faint: #71717a;
      --line: rgba(255,255,255,.09);
      --user: #2f2f2f;
      --assistant: transparent;
      --accent: #f4f4f5;
      --ok: #8ef0b7;
      --app-height: 100dvh;
      --app-top: 0px;
      --keyboard-shift: 0px;
      --keyboard-gap-bg: #0d0d0d;
      --composer-bottom-pad: max(8px, env(safe-area-inset-bottom));
      --dot-core: color(display-p3 .42 1 .68);
      --dot-glow-soft: color(display-p3 .18 1 .48 / .52);
      --dot-glow-peak: color(display-p3 .56 1 .78);
      --dot-glow-deep: color(display-p3 .08 .9 .36 / .58);
      --dot-hdr-flare: color(display-p3 .64 1 .78 / .98);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, "PingFang SC", sans-serif;
    }
    @media (dynamic-range: high) {
      @supports (dynamic-range-limit: no-limit) {
        :root {
          --dot-core: color(display-p3 .54 1 .72);
          --dot-glow-soft: color(display-p3 .22 1 .50 / .72);
          --dot-glow-peak: color(display-p3 .72 1 .86);
          --dot-glow-deep: color(display-p3 .10 1 .42 / .86);
          --dot-hdr-flare: color(display-p3 .86 1 .92);
        }
        .title-dot { dynamic-range-limit: no-limit; }
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; height: 100%; background: var(--topbar-bg); touch-action: pan-x pan-y; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; margin: 0; color: var(--text); overflow: hidden; overscroll-behavior: none; }

    .app {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--app-top);
      width: 100%;
      height: var(--app-height);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--bg);
    }

    .topbar {
      position: relative;
      z-index: 80;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0 12px;
      min-width: 0;
      min-height: calc(var(--topbar-row-height) + max(0px, calc(env(safe-area-inset-top) - var(--topbar-safe-lift))));
      padding: max(0px, calc(env(safe-area-inset-top) - var(--topbar-safe-lift))) 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.22);
      background: var(--topbar-bg);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .title {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: visible;
      font-weight: 760;
      letter-spacing: -.02em;
    }
    .topbar > .title, .topbar > .top-actions { min-height: var(--topbar-row-height); }
    .goal-strip { grid-column: 1 / -1; min-width: 0; display: flex; align-items: center; gap: 2px; border-top: 1px solid var(--line); }
    .goal-strip[hidden], .goal-strip [hidden] { display: none; }
    .goal-summary { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; text-align: left; }
    .goal-summary, .goal-action { min-height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
    .goal-summary { padding: 4px 2px; font-size: 12px; }
    .goal-summary svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--ok); }
    .goal-state { flex: 0 0 auto; color: var(--text); }
    .goal-objective { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .goal-time { flex: 0 0 auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    .goal-action { display: grid; place-items: center; width: 44px; padding: 0; flex: 0 0 auto; }
    .goal-action svg, .goal-summary svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .goal-action svg { width: 17px; height: 17px; }
    .goal-action:hover, .goal-summary:hover { background: var(--panel); color: var(--text); }
    .goal-strip button:disabled { opacity: .45; cursor: wait; }
    .goal-strip.is-stale .goal-summary svg { color: var(--faint); }
    body.thread-menu-open .goal-strip { display: none; }
    body.thread-menu-open .topbar > .title { grid-column: 1 / -1; }
    body.has-goal:not(.thread-menu-open) .notice-pill { margin-top: 45px; }
    .mini-dialog { border: 1px solid var(--line); border-radius: 20px; padding: 20px; width: min(520px, calc(100vw - 28px)); max-height: calc(100dvh - 32px); background: var(--panel); color: var(--text); overflow: auto; }
    .mini-dialog::backdrop { background: rgba(0,0,0,.72); }
    .dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .dialog-heading h2 { font-size: 17px; margin: 0; }
    .dialog-button { min-height: 44px; min-width: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: inherit; font-size: 14px; color: var(--text); background: var(--panel-2); cursor: pointer; }
    .dialog-button:disabled { opacity: .45; cursor: wait; }
    .dialog-button.primary { color: var(--bg); background: var(--text); }
    #goal-objective-input { display: block; width: 100%; min-height: 150px; max-height: 40dvh; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: var(--bg); font: inherit; font-size: 16px; line-height: 1.6; }
    #goal-details, #goal-error { font-size: 12px; line-height: 1.6; color: var(--muted); overflow-wrap: anywhere; }
    #goal-error { color: #ff9a8d; }
    .image-viewer { border: 0; padding: 0; margin: 0; width: 100vw; max-width: none; height: 100dvh; max-height: none; background: #090909; color: var(--text); overflow: hidden; touch-action: none; }
    .image-viewer[open] { display: flex; flex-direction: column; }
    .image-viewer::backdrop { background: #090909; }
    .image-viewer-toolbar { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; padding: max(8px, env(safe-area-inset-top)) 12px 8px; }
    #image-viewer-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .image-viewer-stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; touch-action: none; user-select: none; }
    .image-viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; position: absolute; transform-origin: center; will-change: transform; user-select: none; -webkit-user-drag: none; }
    .image-viewer-stage img[hidden] { display: none; }
    #image-viewer-error { padding: 24px; color: var(--muted); text-align: center; font-size: 14px; }
    .image-viewer-controls { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px 12px max(12px, env(safe-area-inset-bottom)); }
    .image-open { cursor: zoom-in; }
    .attachment-preview[data-preview-id] { width: min(260px, 68vw); height: 180px; object-fit: contain !important; background: rgba(0,0,0,.18); }
    .image-open:focus-visible { outline: 2px solid var(--ok); outline-offset: 3px; }
    .route-badge {
      flex: 0 0 auto;
      height: var(--top-control-size);
      appearance: none;
      display: inline-grid;
      grid-template-columns: 15px auto;
      align-items: center;
      justify-items: center;
      gap: 5px;
      padding: 0 9px 0 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);

      touch-action: manipulation;
    }
    .route-badge.is-compact {
      width: var(--top-control-size);
      grid-template-columns: 1fr;
      gap: 0;
      padding: 0;
    }
    .route-badge.is-compact #route-text { display: none; }
    .route-badge:active { transform: scale(.96); }
    .route-badge svg {

    }
    .route-badge.is-hidden-slot {

    }
    .reasoning-badge,
    .model-badge {
      flex: 0 0 auto;
      height: var(--top-control-size);
      min-width: 42px;
      appearance: none;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      color: var(--muted);
      padding: 0 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 820;
      line-height: 1;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .reasoning-badge {
      min-width: 32px;
      color: #ffd68a;
      border-color: rgba(255,214,138,.26);
      background: rgba(255,214,138,.10);
    }
    .reasoning-badge:not(.mode-xhigh):not(.mode-max):not(.mode-ultra) {

      text-align: center;
    }
    .reasoning-badge.mode-low {
      color: #9ecbff;
      border-color: rgba(158,203,255,.28);
      background: rgba(158,203,255,.10);
    }
    .reasoning-badge.mode-medium {
      color: var(--ok);
      border-color: rgba(142,240,183,.28);
      background: rgba(142,240,183,.11);
    }
    .reasoning-badge.mode-high {
      color: #ffd68a;
      border-color: rgba(255,214,138,.30);
      background: rgba(255,214,138,.12);
    }
    .reasoning-badge.mode-xhigh {
      color: #ff9a8d;
      border-color: rgba(255,154,141,.32);
      background: rgba(255,154,141,.12);
    }
    .reasoning-badge.mode-max {
      color: #ffb38d;
      border-color: rgba(255,179,141,.34);
      background: rgba(255,179,141,.13);
    }
    .reasoning-badge.mode-ultra {
      color: #f6a9ff;

      background: rgba(246,169,255,.13);
    }
    .model-badge.is-official {

      background: rgba(255,141,141,.11);
    }
    .reasoning-badge.is-switching,

      cursor: wait;
    }
    .reasoning-badge:disabled,
    .model-badge:disabled {
      opacity: .5;
      cursor: wait;
    }
    .reasoning-badge:active:not(:disabled),
    .model-badge:active:not(:disabled) {
      transform: scale(.96);
    }
    .model-menu-card {
      position: fixed;
      z-index: 120;
      display: none;
      grid-template-columns: minmax(0, 1fr);
      gap: 3px;
      width: min(260px, calc(100vw - 20px));
      max-height: min(420px, calc(100dvh - 120px));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #202022;
    }
    .model-menu-card.is-open { display: grid; }
    .model-menu-card.has-reasoning { width: min(246px, calc(100vw - 20px)); }
    .model-menu-label {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 11px;
      font-weight: 820;
      line-height: 1;
      padding: 2px 4px 0;
    }
    .model-menu-card.has-reasoning .reasoning-menu-item {
      width: auto;
      min-width: 0;
      justify-content: center;
    }
    .model-menu-item {
      min-width: 0;
      min-height: 38px;
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);

      font-size: 13px;
      line-height: 1.3;

    .model-menu-item:active { transform: scale(.98); }
    .model-menu-item:hover, .model-menu-item.is-current { background: rgba(255,255,255,.08); }
    .model-menu-item.is-current::after {

    .model-picker-trigger { justify-self: center; display: grid; gap: 3px; max-width: 100%; border: 0; border-radius: 6px; padding: 7px 14px; background: rgba(255,255,255,.06); color: var(--muted); font: inherit; cursor: pointer; }
    .model-picker-trigger strong { color: #86baff; font-size: 15px; }
    .model-picker-trigger span { font-size: 12px; overflow-wrap: anywhere; }
    .model-menu-back { display: flex; gap: 9px; align-items: center; border: 0; padding: 7px 10px; color: var(--muted); background: none; font: inherit; font-size: 12px; text-align: left; cursor: pointer; }
    .reasoning-menu-card {
      grid-template-columns: minmax(0, 1fr);

    }
    .reasoning-menu-item {

    }
    .reasoning-menu-item.mode-low {

    .reasoning-menu-item.mode-high {

    }

    }
    .reasoning-menu-item.mode-medium.is-current {

    }
    .reasoning-menu-item.mode-high.is-current {

    .thread-button {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      appearance: none;
      border: 0;
      padding: 6px 7px;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font: inherit;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;

      -webkit-touch-callout: none;
    }

    .is-question button:disabled { opacity: .4; cursor: default; }
    .attachment-tray {
      display: none;
      gap: 8px;
      padding: 0 8px 8px;
      overflow-x: auto;
    }
    .attachment-tray.has-items { display: flex; }
    .attachment-chip {
      position: relative;
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }
    .attachment-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .attachment-chip button {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 999px;
      background: rgba(0,0,0,.62);
      color: white;
      font-size: 14px;
      line-height: 20px;
      padding: 0;
    }
    .composer {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      gap: 5px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #202020;
      box-shadow: none;
    }
    .composer:focus-within, .thread-search-field:focus-within {
      border-color: rgba(255,255,255,.38);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
    }
    .icon-btn, .send-btn {
      appearance: none;
      border: 0;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      position: relative;
      top: -1px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .icon-btn:active, .send-btn:active { transform: scale(.96); }
    .composer-action-hidden { display: none; }
    .stop-square {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      background: currentColor;
      display: block;
    }
    .send-btn {
      left: -1px;
      background: var(--accent);
      color: #111;
      font-size: 20px;
      font-weight: 900;
    }
    .send-btn:disabled { opacity: .45; cursor: default; }
    .send-btn[aria-busy="true"] { cursor: wait; }
    textarea {
      width: 100%;
      max-height: 150px;
      min-height: 38px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 8px 2px;
      position: relative;
      top: -1px;
      color: var(--text);
      background: transparent;
      font: 500 16px / 1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      touch-action: auto;
      overscroll-behavior: contain;
    }
    textarea::placeholder { color: var(--faint); }
    .mini-status { display: none; }

    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body > *:last-child { margin-bottom: 0; }
    .markdown-body p { margin: 0 0 .45em; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: .9em 0 .45em; line-height: 1.2; }
    .markdown-body h1 { font-size: 1.35em; }
    .markdown-body h2 { font-size: 1.18em; }
    .markdown-body h3 { font-size: 1.06em; }
    .markdown-body ul, .markdown-body ol { margin: .35em 0 .6em; padding-left: 1.35em; }
    .markdown-body li { margin: .12em 0; }
    .markdown-body blockquote { margin: .55em 0; padding-left: .9em; border-left: 3px solid #3f3f46; color: var(--muted); }
    .markdown-body pre { margin: .65em 0; padding: .75em .85em; border-radius: 12px; background: var(--panel-2); overflow: auto; white-space: pre-wrap; }
    .markdown-body code { border-radius: 6px; padding: .08em .32em; background: var(--panel-2); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
    .markdown-body pre code { padding: 0; background: transparent; }
    .markdown-body .table-scroll { width: 100%; margin: .65em 0; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid rgba(63,63,70,.78); }
    .markdown-body table { width: 100%; min-width: 420px; border-collapse: collapse; background: rgba(24,24,27,.55); font-size: .94em; }
    .markdown-body th, .markdown-body td { padding: .48em .7em; border: 1px solid rgba(63,63,70,.78); vertical-align: top; text-align: left; }
    .markdown-body th { background: rgba(39,39,42,.88); color: var(--text); font-weight: 750; }
    .markdown-body tr:nth-child(even) td { background: rgba(39,39,42,.34); }
    .markdown-body .align-center { text-align: center; }
    .markdown-body .align-right { text-align: right; }
    .markdown-body a { color: #9ecbff; }
    .memory-citation-card {
      margin: .85em 0 .1em;
      border: 1px solid rgba(135, 164, 255, .20);
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(92, 124, 255, .13), rgba(44, 211, 162, .075)),
        rgba(24, 24, 27, .62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.055), 0 12px 34px rgba(0,0,0,.18);
      overflow: hidden;
    }
    .memory-citation-card summary {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      cursor: pointer;
      color: #d7ddff;
      list-style: none;
      user-select: none;
    }
    .memory-citation-card summary::-webkit-details-marker { display: none; }
    .memory-citation-icon {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: rgba(136, 166, 255, .16);
      box-shadow: inset 0 0 0 1px rgba(183, 202, 255, .16);
      font-size: 12px;
      line-height: 1;
    }
    .memory-citation-title {
      min-width: 0;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: .01em;
    }
    .memory-citation-count {
      color: rgba(215, 221, 255, .68);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .memory-citation-list {
      display: grid;
      gap: 8px;
      padding: 0 12px 12px 43px;
    }
    .memory-citation-item {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 12px;
      background: rgba(0,0,0,.16);
    }
    .memory-citation-path {
      color: rgba(255,255,255,.86);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .memory-citation-note {
      margin-top: 4px;
      color: rgba(214, 222, 255, .58);
      font-size: 11.5px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .memory-citation-empty {
      padding: 0 12px 12px 43px;
      color: rgba(214, 222, 255, .58);
      font-size: 12px;
    }

    @media (max-width: 700px) {
      :root { --topbar-row-height: 44px; --topbar-safe-lift: 12px; --top-control-size: 24px; --topbar-content-lift: -5px; }
      .topbar { padding-left: 12px; padding-right: 12px; }
      .topbar > .title,
      .topbar > .top-actions { transform: translateY(var(--topbar-content-lift)); }
      .route-badge { grid-template-columns: 14px auto; padding-inline: 7px 8px; font-size: 11px; gap: 4px; }
      .route-badge.is-compact { width: var(--top-control-size); grid-template-columns: 1fr; gap: 0; padding: 0; }
      .route-badge svg { width: 14px; height: 14px; transform: translateY(.2px); }
      .reasoning-badge,
      .model-badge { min-width: 38px; padding-inline: 8px; font-size: 11px; }
      .top-actions .reasoning-badge { display: none; }
      .model-menu-card.has-reasoning { grid-template-columns: minmax(0, 1fr); }
      #route-text { line-height: 14px; transform: translateY(.1px); }
      .thread-button { padding-inline: 5px; }
      .thread-name { max-width: min(48vw, 300px); }
      .top-actions {
        flex-basis: auto;
        width: auto;
        max-width: calc(100vw - 144px);
        gap: 6px;
      }
      .composer-meta { padding-inline: 0; gap: 5px; }
      .composer-meta-controls { gap: 5px; }
      .composer-meta .model-badge { max-width: 40vw; padding-inline: 7px; gap: 2px; font-size: 11px; }
      .composer-meta .model-control-effort { font-size: 10px; }
      .conversation-usage-cost { display: none; }
      .thread { padding: 18px 12px var(--thread-composer-gap); }
      .bubble-wrap { max-width: 88%; }
      .message.assistant .bubble-wrap { width: 100%; max-width: none; }
      .message.user .bubble-wrap { max-width: 88%; }
      .bubble { font-size: 15px; }
      .composer-shell {
        padding-left: max(var(--thread-menu-edge-gap), calc((100vw - 520px) / 2));
        padding-right: max(var(--thread-menu-edge-gap), calc((100vw - 520px) / 2));
      }
      .composer { border-radius: 29px; }
    }

    body.standalone .thread { padding-top: 16px; }
    body.standalone .composer-shell {
      padding-top: var(--thread-composer-gap);
      padding-bottom: var(--composer-bottom-pad);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title">
        <span class="title-dot"></span>
        <button class="thread-button" id="thread-button" type="button" aria-controls="thread-menu" aria-expanded="false"><span class="thread-current-pin" id="thread-current-pin" aria-hidden="true"></span><span class="thread-name" id="thread-name">选择线程</span></button>
      </div>
      <div class="top-actions">
        <button class="logout-btn" id="logout-session" type="button" title="退出" aria-label="退出">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
        </button>
      </div>
      <div class="model-menu-card reasoning-menu-card" id="reasoning-menu-card" aria-label="选择推理模式"></div>
      <div class="model-menu-card" id="model-menu-card" aria-label="选择模型"></div>
      <div class="permission-menu-card" id="permission-menu-card" aria-label="当前权限"></div>
      <button class="context-quick-card" id="context-quick-card" type="button" aria-label="发送压缩指令"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8"></path><path d="M6 7h12"></path><path d="M9 11h6"></path><path d="M12 15v6"></path><path d="m8 17 4 4 4-4"></path></svg><span>压缩</span></button>
      <div class="thread-action-card" id="thread-action-card" aria-label="当前线程操作">
        <div class="thread-action-buttons">
          <button class="thread-action-button is-danger" id="thread-action-archive" type="button"><span class="action-icon" id="thread-action-archive-icon" aria-hidden="true"></span><span>归档</span></button>
          <button class="thread-action-button" id="thread-action-rename" type="button"><span class="action-icon" id="thread-action-rename-icon" aria-hidden="true"></span><span>重命名</span></button>
          <button class="thread-action-button is-blue" id="thread-action-pin-toggle" type="button"><span class="action-icon" id="thread-action-pin-toggle-icon" aria-hidden="true"></span><span id="thread-action-pin-toggle-text">置顶</span></button>
          <button class="thread-action-button" id="thread-question-restore" type="button" hidden><span class="action-icon" aria-hidden="true">↶</span><span>重新显示历史提问</span></button>
        </div>
        <div class="thread-rename-panel">
          <input class="thread-rename-input" id="thread-rename-input" type="text" autocomplete="off" enterkeyhint="done" maxlength="120" />
          <div class="thread-rename-actions">
            <button type="button" id="thread-rename-cancel">取消</button>
            <button class="save" type="button" id="thread-rename-save">保存</button>
          </div>
        </div>
      </div>
      <section class="goal-strip" id="goal-strip" aria-label="当前目标" hidden>
        <button class="goal-summary" id="goal-edit" type="button" title="查看和修改目标">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="goal-state" id="goal-state"></span><span class="goal-objective" id="goal-objective"></span>
        </button>
        <span class="goal-time" id="goal-time"></span>
        <button class="goal-action" id="goal-pause" type="button" aria-label="暂停目标" title="暂停目标"></button>
        <button class="goal-action" id="goal-clear" type="button" aria-label="清除目标" title="清除目标"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button>
      </section>
    </header>

    <div class="notice-pill" id="notice" role="status" aria-live="polite"></div>
    <div class="thread-menu-scrim" id="thread-menu-scrim" aria-hidden="true"></div>
    <nav class="thread-menu" id="thread-menu" aria-label="Codex 任务列表">
      <div class="thread-menu-toolbar">
        <div class="thread-search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="thread-search" type="search" placeholder="搜索任务或项目" aria-label="搜索已加载的任务或项目" aria-describedby="thread-search-summary" autocomplete="off" />
          <button class="thread-menu-tool" id="thread-search-clear" type="button" aria-label="清除搜索" hidden>清除</button>
        </div>
        <button class="thread-menu-tool" id="thread-menu-refresh" type="button" aria-label="刷新任务列表">刷新</button>
        <button class="thread-menu-tool" id="thread-menu-close" type="button" aria-label="关闭任务列表">完成</button>
      </div>
      <p class="thread-search-summary" id="thread-search-summary" role="status" aria-live="polite"></p>
      <div class="session-controls" id="session-controls" hidden>
        <div class="session-actions">
          <label class="session-setting" for="session-idle"><span>自动释放</span><select id="session-idle" aria-label="自动释放的空闲时间" aria-describedby="session-status" title="回复结束后，空闲多久自动释放"><option value="0">完成后立即</option><option value="60" selected>空闲 1 分钟</option><option value="300">空闲 5 分钟</option><option value="900">空闲 15 分钟</option></select></label>
          <button class="thread-section-action session-release" id="release-session" type="button" aria-describedby="session-status" title="停止 Mini 当前回复并归还会话；待发送队列保留" hidden>释放会话</button>
        </div>
        <p class="session-status" id="session-status" role="status">未接管对话</p>
      </div>
      <div id="thread-menu-list"></div>
    </nav>

    <main class="thread" id="thread" aria-label="聊天记录">
      <div class="day-note">手机同步到当前 Codex 对话</div>
      <button class="thread-list-toggle" id="history-more" type="button" hidden>加载更早消息</button>
    </main>

    <footer class="composer-shell">
      <button class="jump-to-latest" id="jump-to-latest" type="button" title="回到最新消息" aria-label="回到最新消息" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m-7-7 7 7 7-7"/></svg></button>
      <div class="attachment-tray" id="attachment-tray" aria-label="待发送图片"></div>
      <div class="approval-panel" id="approval-panel" role="alert" aria-live="assertive"></div>
      <section class="approval-panel is-question question-history-panel" id="desktop-question-history" aria-label="历史提问"></section>
      <div class="queued-send-bar" id="queued-send" role="status" aria-live="polite">
        <div class="queued-send-header">
          <span class="queued-send-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="M4.5 4.5v4.75c0 3 1.75 4.75 4.75 4.75h6.25"/><path d="M12.25 10.75 15.5 14l-3.25 3.25"/></svg>
          </span>
          <span class="queued-send-label" id="queued-send-label">排队</span>
          <button class="queue-action" id="queue-continue" type="button" hidden>继续队列</button>
          <button class="queue-action" id="queue-guide" type="button">引导</button>
        </div>
        <div class="queued-send-list" id="queued-send-list"></div>
      </div>
      <div class="composer-meta" id="composer-meta" aria-label="当前 Codex 用量、权限、上下文和模型">
        <div class="composer-meta-controls">
          <button class="meta-pill usage-pill quota-pill is-unknown" id="codex-quota-badge" type="button" title="Codex 剩余额度：暂未读取" aria-label="Codex 剩余额度：暂未读取"><span class="quota-ring" id="codex-quota-ring" aria-hidden="true"></span><span class="usage-value" id="codex-quota-text">--</span></button>
          <button class="meta-pill permission-pill" id="permission-badge" type="button" title="查看当前权限策略" aria-label="更改权限"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.6-2.9 8-7 10-4.1-2-7-5.4-7-10V6Z"></path><path d="m9.3 12 1.8 1.8 3.8-4"></path></svg><span><span class="permission-verbose">更改</span>权限</span></button>
          <button class="meta-pill usage-pill context-status is-unknown mode-percent" id="top-status" type="button" aria-live="polite" aria-label="上下文窗口用量"><span class="context-ring" aria-hidden="true"></span><span class="context-text"><span class="context-percent">--</span></span></button>
          <button class="model-badge is-unknown is-loading" id="model-badge" type="button" title="正在读取模型与思考等级" aria-label="正在读取模型与思考等级" aria-busy="true" disabled><span id="model-text"></span><span class="model-control-effort" id="reasoning-text"></span><span class="model-control-chevron" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="m3 4.5 3 3 3-3"/></svg></span></button>
          <button class="reasoning-badge is-unknown" id="reasoning-badge" type="button" title="当前思考等级" aria-label="当前思考等级" hidden aria-hidden="true"></button>
          <button class="keep-awake-btn" id="keep-awake" type="button" title="保持亮屏" aria-label="保持亮屏" hidden></button>
          <button class="route-badge" id="route-badge" type="button" title="当前线路：本地" aria-label="当前线路：本地" hidden>
            <svg class="route-icon" id="route-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
            <span id="route-text">本地</span>
          </button>
        </div>
      </div>
      <form class="composer" id="composer">
        <button class="icon-btn" id="attach" type="button" title="添加照片或附件" aria-label="添加照片或附件">＋</button>
        <input class="file-input" id="file-input" type="file" accept="image/*" multiple />
        <textarea id="text" rows="1" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="发消息给 Codex Relay"></textarea>
        <button class="send-btn stop-btn composer-action-hidden" id="stop" type="button" title="取消当前 Codex 回复" aria-label="取消当前 Codex 回复" disabled hidden><span class="stop-square" aria-hidden="true"></span></button>
        <button class="send-btn" id="send" type="submit" title="输入内容后发送" aria-label="输入内容后发送" disabled>↑</button>
      </form>
    </footer>
  </div>

  <dialog class="mini-dialog" id="goal-dialog" aria-labelledby="goal-dialog-title">
    <form id="goal-form">
      <div class="dialog-heading"><h2 id="goal-dialog-title">当前目标</h2><button class="dialog-button" id="goal-close" type="button" aria-label="关闭目标详情">×</button></div>
      <p id="goal-details"></p>
      <textarea id="goal-objective-input" aria-label="目标内容" maxlength="20000" required></textarea>
      <p id="goal-error" role="alert"></p>
      <div class="dialog-actions"><button class="dialog-button" id="goal-cancel" type="button">取消</button><button class="dialog-button primary" id="goal-save" type="submit">保存修改</button></div>
    </form>
  </dialog>
  <dialog class="image-viewer" id="image-viewer" aria-label="图片预览">
    <div class="image-viewer-toolbar"><span id="image-viewer-name"></span><button class="dialog-button" id="image-viewer-close" type="button" aria-label="关闭图片预览" autofocus>×</button></div>
    <div class="image-viewer-stage" id="image-viewer-stage"><img id="image-viewer-image" alt="" draggable="false"/><p id="image-viewer-error" role="status"></p></div>
    <div class="image-viewer-controls"><button class="dialog-button" id="image-zoom-out" type="button" aria-label="缩小图片">−</button><button class="dialog-button" id="image-zoom-reset" type="button" title="还原图片大小">100%</button><button class="dialog-button" id="image-zoom-in" type="button" aria-label="放大图片">＋</button></div>
  </dialog>

  <script>
    // A URL fragment never reaches the relay. Pair before restoring any device state.
    function acceptRelayPairingLink() {
      if (!new URLSearchParams(location.hash.slice(1)).has('k')) return false;
      window.codexMiniPairing = true;
      document.documentElement.style.visibility = 'hidden';
      const target = new URL(location.href);
      if (target.searchParams.get('pair') === '1') {
        // Older relays proxy this page instead of serving the pairing page.
        target.pathname = target.pathname.replace(/\/?$/, '/logout');
        target.search = '?next=login';
      } else target.search = '?pair=1';
      location.replace(target.href);
      return true;
    }
    acceptRelayPairingLink();
    window.addEventListener('hashchange', acceptRelayPairingLink);
    const loadedClientVersion = window.crypto?.subtle
      ? crypto.subtle.digest('SHA-256', new TextEncoder().encode(document.currentScript.textContent.replace(/\r\n?/g, '\n')))
        .then(hash => Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('')).catch(() => '')
      : Promise.resolve('');
    let clientVersionCheckBusy = false;
    let lastClientVersionCheckAt = 0;

      html = html.replace(/!\[((?:\\.|[^\]\\])*)\]\(codex-image:([a-zA-Z0-9_-]{43})\)/g, (_, alt, id) => {

      });
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/@@IMAGE(\d+)@@/g, (_, index) => images[Number(index)] || '');

    function splitMarkdownTableRow(line) {

      const cells = [];
      let cell = '';
      for (let index = 0; index < value.length; index += 1) {
        const char = value[index];
        const next = value[index + 1];
        if (char === '\\' && (next === '|' || next === '\\')) {
          cell += next;
          index += 1;
          continue;
        }
        if (char === '|') {

      const body = rows.map(row => `<tr>${pad(row).map((cell, index) => `<td${tableCellClass(alignments, index)}>${renderInlineMarkdown(cell)}</td>`).join('')}</tr>`).join('');

    function splitMemoryCitationBlocks(markdown) {

      const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };

        if (trimmed.startsWith('```')) {

      // Intentionally empty: let iOS/Safari own keyboard layout.
    }

    function stopKeyboardMonitor() {
      if (!keyboardMonitorTimer) return;
      window.clearInterval(keyboardMonitorTimer);
      keyboardMonitorTimer = null;
    }

    function restoreLayoutAfterKeyboard() {
      if (suppressNextTextareaBlurRestore) {
        suppressNextTextareaBlurRestore = false;
        stopKeyboardMonitor();
        keyboardAlignmentTimers.forEach(timer => window.clearTimeout(timer));
        keyboardAlignmentTimers = [];
        document.body.classList.remove('keyboard-open');
        keyboardComposerRevealDone = false;
        keyboardFocusStartedAt = 0;
        alignComposerForKeyboard();
        return;
      }
      if (document.body.classList.contains('thread-menu-open')) return;
      const now = performance.now();
      const recentInputFocus = now - lastTextareaFocusPrepareAt < 650;
      const recentOutsideDismiss = lastOutsideComposerTouchAt > lastTextareaFocusPrepareAt && now - lastOutsideComposerTouchAt < 700;
      if (recentInputFocus && !recentOutsideDismiss) {
        window.setTimeout(() => {
          if (document.body.classList.contains('thread-menu-open')) return;
          if (document.activeElement === textarea) return;
          try {
            textarea.focus({ preventScroll: true });
          } catch {
            textarea.focus();
          }
          beginKeyboardAlignment();
        }, 40);
        return;
      }
      stopKeyboardMonitor();
      keyboardAlignmentTimers.forEach(timer => window.clearTimeout(timer));
      keyboardAlignmentTimers = [];
      keyboardPinTimers.forEach(timer => window.clearTimeout(timer));
      keyboardPinTimers = [];
      if (keyboardAlignRaf) {
        window.cancelAnimationFrame(keyboardAlignRaf);
        keyboardAlignRaf = 0;
      }
      document.body.classList.remove('keyboard-open');
      keyboardComposerRevealDone = false;
      keyboardFocusStartedAt = 0;
      alignComposerForKeyboard();
    }

    function readOpenProjectKeys() {
      try {
        const keys = JSON.parse(localStorage.getItem(GROUPS_STORAGE_KEY) || '[]');
        return new Set(Array.isArray(keys) ? keys.filter(Boolean) : []);
      } catch {
        return new Set();
      }
    }

    function threadBrowserMetadata(item) {
      if (!item || typeof item.id !== 'string' || typeof item.name !== 'string') return null;
      const row = {};
      for (const key of ['id', 'name', 'nameSource', 'updatedAt', 'effectiveUpdatedAt', 'cwd', 'source', 'parentThreadId', 'forkedFromId', 'projectId', 'projectKey', 'projectName', 'projectPath']) {
        if (typeof item[key] === 'string') row[key] = item[key];
      }
      row.effectiveUpdatedMs = Number(item.effectiveUpdatedMs) || 0;
      row.isProjectThread = Boolean(item.isProjectThread);
      row.pinned = Boolean(item.pinned);
      row.children = (Array.isArray(item.children) ? item.children : []).map(threadBrowserMetadata).filter(Boolean);
      return row;
    }

    function persistThreadBrowserCache() {
      if (!threadBrowserCacheKey) return;
      try {
        const pages = Object.fromEntries(Object.entries(threadPages).map(([scope, page]) => [scope, {
          loaded: page.loaded, nextCursor: page.nextCursor, resumeCursor: page.resumeCursor,
        }]));
        localStorage.setItem(threadBrowserCacheKey, JSON.stringify({
          version: 1, at: Date.now(), threads: knownThreads.map(threadBrowserMetadata).filter(Boolean), pages,
          view: threadMenuView, openProjects: [...openProjectKeys], expandedProjects: [...expandedProjectThreadKeys],
          selectedProjectKey, scroll: threadSectionScroll,
        }));
      } catch {} // Storage quotas/private browsing must not interrupt the live list.
    }

    function scheduleThreadBrowserCache() {
      window.clearTimeout(threadBrowserCacheTimer);
      threadBrowserCacheTimer = window.setTimeout(persistThreadBrowserCache, 250);
    }

    function restoreThreadBrowserCache() {
      try {
        const saved = JSON.parse(localStorage.getItem(threadBrowserCacheKey) || 'null');
        if (saved?.version !== 1 || !Number.isFinite(saved.at) || Date.now() - saved.at > 7 * 86400000
            || !Array.isArray(saved.threads) || !saved.pages) return false;
        knownThreads = saved.threads.map(threadBrowserMetadata).filter(Boolean);
        for (const [scope, page] of Object.entries(threadPages)) {
          const cached = saved.pages[scope];
          if (!cached?.loaded) continue;
          Object.assign(page, { loaded: true, moreLoaded: true, at: 0,
            nextCursor: typeof cached.nextCursor === 'string' ? cached.nextCursor : null });
          if (cached.resumeCursor === null || typeof cached.resumeCursor === 'string') page.resumeCursor = cached.resumeCursor;
        }
        if (['split', 'projects', 'conversations'].includes(saved.view)) threadMenuView = saved.view;
        if (Array.isArray(saved.openProjects)) openProjectKeys = new Set(saved.openProjects.filter(key => typeof key === 'string'));
        if (Array.isArray(saved.expandedProjects)) expandedProjectThreadKeys = new Set(saved.expandedProjects.filter(key => typeof key === 'string'));
        selectedProjectKey = typeof saved.selectedProjectKey === 'string' ? saved.selectedProjectKey : '';
        for (const view of ['split', 'projects', 'conversations']) for (const scope of ['projects', 'conversations']) {
          const key = `${view}:${scope}`;
          threadSectionScroll[key] = Math.max(0, Number(saved.scroll?.[key]) || 0);
        }
        return true;
      } catch { return false; }
    }

    function reloadForDeviceChange() {
      if (deviceSwitching || window.codexMiniPairing) return;
      deviceSwitching = true;
      document.documentElement.style.visibility = 'hidden';
      location.reload();
    }

    async function initializeThreadBrowserCache() {
        const status = await refreshRelayStatus({ quiet: true });
        if (logoutBusy || !status?.ok || (publicRelayPage && !status.deviceId)) throw new Error('尚未确认当前设备，请刷新重试。');
        // Verify the device before showing a cached list on a shared relay origin.
        activeDeviceId = status.deviceId || '';
        deviceStorageScope = `${currentApiBase}:${status.deviceId || 'local'}`;
        SELECTED_THREAD_STORAGE_KEY = `codexMini.selectedThread:${deviceStorageScope}`;
        STORAGE_PREFIX = `codexMiniChat.v3:${deviceStorageScope}`;
        ROUTE_STORAGE_KEY = `codexMini.apiRoutes.v1:${deviceStorageScope}`;
        GROUPS_STORAGE_KEY = `codexMini.threadGroups.open.v1:${deviceStorageScope}`;
        PROJECT_THREAD_EXPANDED_STORAGE_KEY = `codexMini.projectThreads.expanded.v1:${deviceStorageScope}`;
        THREAD_NOTICE_STORAGE_KEY = `codexMini.threadCompleteNotices.v1:${deviceStorageScope}`;
        REASONING_OVERRIDE_STORAGE_KEY = `codexMini.reasoningOverrides.v1:${deviceStorageScope}`;
        MODEL_OVERRIDE_STORAGE_KEY = `codexMini.modelOverrides.v1:${deviceStorageScope}`;
        selectedThreadId = localStorage.getItem(SELECTED_THREAD_STORAGE_KEY) || '';
        legacySelectedThreadId = localStorage.getItem('codexMini.selectedThread') || '';
        openProjectKeys = readOpenProjectKeys();
        expandedProjectThreadKeys = readExpandedProjectThreadKeys();
        hasSavedProjectGroupState = localStorage.getItem(GROUPS_STORAGE_KEY) !== null;
        completedThreadIds = readCompletedThreadIds();
        try { localStorage.setItem(`codexMini.relayDevice.v1:${currentApiBase}`, activeDeviceId); } catch {}
        threadBrowserCacheKey = `codexMini.threadBrowser.v1:${currentApiBase}:${status.deviceId || 'local'}`;
        restoreOptionCache(status.deviceId);
        if (restoreThreadBrowserCache()) {
          updateThreadTitle();
